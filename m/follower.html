<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://evrqxgnqwngokukqerps.supabase.co https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), browsing-topics=()">
    <title>لوحة المتابعة | نظام الشحن الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes repDateFilterGlow {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.08), 0 0 10px rgba(99, 102, 241, 0.16);
                border-color: rgba(99, 102, 241, 0.45);
                transform: translateY(0) scale(1);
            }

            50% {
                box-shadow: 0 0 0 5px rgba(99, 102, 241, 0.16), 0 0 24px rgba(99, 102, 241, 0.48);
                border-color: rgba(99, 102, 241, 1);
                transform: translateY(-1px) scale(1.01);
            }
        }

        .rep-date-filter-glow {
            animation: repDateFilterGlow 1.1s ease-in-out infinite;
            will-change: box-shadow, border-color, transform;
        }

        body {
            background-image:
                radial-gradient(at top right, rgba(99, 102, 241, 0.08) 0px, transparent 42%),
                radial-gradient(at bottom left, rgba(16, 185, 129, 0.05) 0px, transparent 38%);
            background-attachment: fixed;
        }

        .glass {
            border-radius: 1.6rem;
        }

        .glass .overflow-x-auto {
            scrollbar-width: thin;
        }

        .hero-shell {
            position: relative;
            overflow: hidden;
        }

        .hero-shell::before {
            content: "";
            position: absolute;
            top: -70px;
            right: -30px;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.16), transparent 68%);
            pointer-events: none;
        }

        .hero-shell::after {
            content: "";
            position: absolute;
            bottom: -90px;
            left: -40px;
            width: 210px;
            height: 210px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12), transparent 70%);
            pointer-events: none;
        }

        .header-chip {
            background: rgba(255, 255, 255, 0.74);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.86);
        }

        .dark .header-chip {
            background: rgba(15, 23, 42, 0.74);
            border-color: rgba(148, 163, 184, 0.14);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .panel-surface {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(248, 250, 252, 0.94));
            border: 1px solid rgba(226, 232, 240, 0.88);
            box-shadow: 0 18px 36px rgba(15, 23, 42, 0.07);
        }

        .dark .panel-surface {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.84));
            border-color: rgba(51, 65, 85, 0.88);
        }

        .soft-control {
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
        }

        .dark .soft-control {
            background: rgba(15, 23, 42, 0.88);
            border-color: rgba(148, 163, 184, 0.16);
        }

        .table-shell {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.94));
            border: 1px solid rgba(226, 232, 240, 0.92);
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        }

        .dark .table-shell {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.92));
            border-color: rgba(51, 65, 85, 0.92);
        }

        .table-shell thead th {
            background: rgba(99, 102, 241, 0.08);
            color: #3730a3;
        }

        .dark .table-shell thead th {
            background: rgba(99, 102, 241, 0.14);
            color: #c7d2fe;
        }

        .table-shell tbody tr {
            transition: background 0.2s ease;
        }

        .table-shell tbody tr:hover {
            background: rgba(99, 102, 241, 0.04);
        }

        .dark .table-shell tbody tr:hover {
            background: rgba(99, 102, 241, 0.08);
        }

        .table-fit {
            table-layout: fixed;
            width: 100%;
        }

        .table-fit th,
        .table-fit td {
            word-break: break-word;
            overflow-wrap: anywhere;
            vertical-align: top;
        }

        .table-fit .cell-compact {
            white-space: normal;
            line-height: 1.6;
        }

        @media (max-width: 1024px) {
            .table-fit th,
            .table-fit td {
                padding: 0.65rem 0.5rem;
                font-size: 0.74rem;
            }
        }

        #shipmentMenu {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(226, 232, 240, 0.95);
            box-shadow: 0 20px 44px rgba(15, 23, 42, 0.14);
        }

        .dark #shipmentMenu {
            background: rgba(15, 23, 42, 0.96);
            border-color: rgba(51, 65, 85, 0.92);
            box-shadow: 0 26px 56px rgba(2, 6, 23, 0.5);
        }

        .swal2-popup {
            border-radius: 1.6rem !important;
            border: 1px solid rgba(226, 232, 240, 0.9) !important;
            box-shadow: 0 24px 54px rgba(15, 23, 42, 0.16) !important;
            padding-top: 1.4rem !important;
        }

        .swal2-title {
            font-weight: 900 !important;
            color: #0f172a !important;
        }

        .swal2-html-container {
            color: #475569 !important;
            font-weight: 700 !important;
        }

        .swal2-input,
        .swal2-select {
            border-radius: 1rem !important;
            border: 1px solid rgba(148, 163, 184, 0.28) !important;
            box-shadow: none !important;
        }

        .swal2-confirm {
            background: linear-gradient(135deg, #4f46e5, #6366f1) !important;
            border-radius: 0.9rem !important;
            font-weight: 900 !important;
            box-shadow: 0 14px 24px rgba(79, 70, 229, 0.24) !important;
        }

        .swal2-cancel {
            border-radius: 0.9rem !important;
            font-weight: 800 !important;
        }

        body.dark .swal2-popup {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.94)) !important;
            border-color: rgba(51, 65, 85, 0.92) !important;
            box-shadow: 0 28px 60px rgba(2, 6, 23, 0.56) !important;
        }

        body.dark .swal2-title,
        body.dark .swal2-html-container {
            color: #e2e8f0 !important;
        }

        body.dark .swal2-input,
        body.dark .swal2-select {
            background: rgba(15, 23, 42, 0.96) !important;
            color: #f8fafc !important;
            border-color: rgba(99, 102, 241, 0.22) !important;
        }
    </style>
</head>

<body class="bg-indigo-50/50 dark:bg-slate-950 min-h-screen transition-colors duration-300">

    <!-- Header -->
    <header class="glass hero-shell sticky top-0 z-50 px-4 py-4 mb-6 shadow-sm">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-gradient-to-br from-indigo-600 via-indigo-500 to-sky-500 rounded-[1rem] flex items-center justify-center text-white shadow-xl ring-4 ring-white/70 dark:ring-slate-900/40 relative z-10">
                    <i class="fas fa-eye"></i>
                </div>
                <div class="relative z-10">
                    <h1 class="text-lg font-black text-slate-800 dark:text-white">لوحة المتابعة</h1>
                    <div class="mt-1 inline-flex items-center gap-2 rounded-full px-3 py-1 header-chip">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <p class="text-xs font-black text-indigo-700 dark:text-indigo-300" id="followerName">جاري التحميل...</p>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2 relative z-10">
                <button onclick="toggleTheme()"
                    class="p-2.5 rounded-2xl header-chip text-slate-400 dark:text-slate-300 hover:text-indigo-600 transition-colors">
                    <i id="themeIcon" class="fas fa-moon text-xl"></i>
                </button>
                <button onclick="logout()" class="p-2.5 rounded-2xl header-chip text-rose-500 hover:text-rose-700 transition-colors"
                    title="تسجيل خروج">
                    <i class="fas fa-sign-out-alt text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 pb-12 space-y-6">

        <!-- Search -->
        <div class="glass panel-surface p-4 rounded-3xl">
            <div class="relative">
                <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="debouncedFilterData()"
                    placeholder="ابحث برقم الشحنة، اسم العميل، رقم الهاتف، أو هاتف بديل..."
                    class="w-full soft-control pr-12 pl-4 py-3.5 rounded-2xl text-sm font-black text-slate-700 dark:text-white outline-none focus:border-indigo-500 transition-colors">
            </div>
        </div>

        <!-- Filters -->
        <div class="glass panel-surface p-4 sm:p-5 rounded-3xl flex flex-col md:flex-row gap-4 flex-wrap">
            <div class="flex-[1_1_100%] md:flex-[0_0_auto] md:w-64">
                <label class="block text-xs font-bold text-slate-500 mb-1">فلتر اليومية</label>
                <div class="relative">
                    <select id="filterUpdate" onchange="filterData()"
                        class="rep-date-filter-glow w-full bg-gradient-to-r from-indigo-600 to-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-bold outline-none appearance-none border border-indigo-700 shadow-md focus:ring-2 focus:ring-indigo-300">
                        <option value="" class="text-slate-800 bg-white">كل اليوميات</option>
                    </select>
                    <i
                        class="fas fa-calendar-alt absolute left-3 top-1/2 -translate-y-1/2 text-indigo-100 pointer-events-none text-sm"></i>
                </div>
            </div>
            <div class="flex-1">
                <label class="block text-xs font-bold text-slate-500 mb-1">المندوب</label>
                <div class="relative">
                    <select id="filterRep" onchange="filterData()"
                        class="w-full soft-control px-4 py-2.5 rounded-xl text-sm font-bold text-slate-700 dark:text-slate-200 outline-none appearance-none">
                        <option value="">كافة المناديب</option>
                    </select>
                    <i
                        class="fas fa-chevron-down absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                </div>
            </div>
            <div class="flex-1">
                <label class="block text-xs font-bold text-slate-500 mb-1">الحالة</label>
                <div class="relative">
                    <select id="filterStatus" onchange="filterData()"
                        class="w-full soft-control px-4 py-2.5 rounded-xl text-sm font-bold text-slate-700 dark:text-slate-200 outline-none appearance-none">
                        <option value="">كافة الحالات</option>
                    </select>
                    <i
                        class="fas fa-chevron-down absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                </div>
            </div>
            <div class="flex-1">
                <label class="block text-xs font-bold text-slate-500 mb-1">الزون (المنطقة)</label>
                <div class="relative">
                    <select id="filterZone" onchange="filterData()"
                        class="w-full soft-control px-4 py-2.5 rounded-xl text-sm font-bold text-slate-700 dark:text-slate-200 outline-none appearance-none">
                        <option value="">كافة المناطق</option>
                    </select>
                    <i
                        class="fas fa-chevron-down absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                </div>
            </div>
            <div class="flex-1">
                <label class="block text-xs font-bold text-slate-500 mb-1">الراسل (المكتب)</label>
                <div class="relative">
                    <select id="filterSender" onchange="filterData()"
                        class="w-full soft-control px-4 py-2.5 rounded-xl text-sm font-bold text-slate-700 dark:text-slate-200 outline-none appearance-none">
                        <option value="">كافة المكاتب</option>
                    </select>
                    <i
                        class="fas fa-chevron-down absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="glass table-shell p-4 rounded-3xl overflow-hidden shadow-sm">
            <div class="overflow-x-hidden">
                <table class="table-fit w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-indigo-50 text-indigo-800 border-b-2 border-indigo-100">
                            <th class="p-3 text-sm font-bold">اسم العميل</th>
                            <th class="p-3 text-sm font-bold">العنوان</th>
                            <th class="p-3 text-sm font-bold">المنتج</th>
                            <th class="p-3 text-sm font-bold">المبلغ</th>
                            <th class="p-3 text-sm font-bold">المندوب</th>
                            <th class="p-3 text-sm font-bold">الحالة</th>
                            <th class="p-3 text-sm font-bold">سبب الحالة</th>
                            <th class="p-3 text-sm font-bold">عدد المحاولات</th>
                            <th class="p-3 text-sm font-bold">ملاحظات</th>
                            <th class="p-3 text-sm font-bold">السعر اضافي</th>
                            <th class="p-3 text-sm font-bold text-center">اجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="shipmentsTableBody" class="divide-y divide-slate-100">
                        <!-- Dynamic rows -->
                        <tr>
                            <td colspan="11" class="text-center p-8 text-slate-500 font-bold">جاري تحميل البيانات...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- Pagination Container -->
            <div id="paginationContainer" class="mt-6 mb-2 flex justify-center items-center gap-2 flex-wrap" dir="ltr">
            </div>
        </div>
        <div id="shipmentMenu"
            class="hidden fixed z-50 min-w-[220px] rounded-2xl border border-slate-200 bg-white p-2 shadow-2xl">
            <button onclick="logShipmentContactAttemptFromMenu()"
                class="w-full rounded-xl px-4 py-3 text-right text-sm font-bold text-indigo-700 transition-colors hover:bg-indigo-50">
                تسجيل محاولة
            </button>
            <button onclick="copyShipmentDataFromMenu()"
                class="w-full rounded-xl px-4 py-3 text-right text-sm font-bold text-slate-700 transition-colors hover:bg-slate-100">
                نسخ بيانات الشحنة
            </button>
        </div>

    </main>

    <script src="assets/js/config.js"></script>
    <script>
        const { createClient } = supabase;
        const supabaseClient = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        const SHIPMENT_PRICE_FIELD = 'السعر بعد التعديل';
        const SHIPMENT_PRICE_FIELD_LEGACY = 'السعر_بعد_التعديل';
        const SHIPMENT_CODE_FIELD = 'كود الشحنة';
        const SHIPMENT_CODE_FIELD_LEGACY = 'order_id';

        function normalizeShipmentPriceField(record) {
            return normalizeShipmentRecordHeaders(record);
        }

        let user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'follower') {
            window.location.href = '../index.html';
        }
        startStoredUserSessionGuard(supabaseClient, {
            allowedRoles: ['follower'],
            redirectTo: '../index.html',
            onValidUser: (latestUser) => {
                user = latestUser;
                const followerName = document.getElementById('followerName');
                if (followerName) followerName.innerText = latestUser.full_name || latestUser.username || latestUser.phone;
            }
        });

        document.getElementById('followerName').innerText = user.full_name || user.username || user.phone;

        let allShipments = [];
        let currentPage = 1;
        let activeShipmentMenuId = null;
        let repContactsMap = new Map();
        const itemsPerPage = 30;
        const FOLLOWER_UI_STATE_KEY = 'followerUiState';

        function saveFollowerUiState() {
            try {
                localStorage.setItem(FOLLOWER_UI_STATE_KEY, JSON.stringify({
                    search: document.getElementById('searchInput')?.value || '',
                    rep: document.getElementById('filterRep')?.value || '',
                    status: document.getElementById('filterStatus')?.value || '',
                    zone: document.getElementById('filterZone')?.value || '',
                    sender: document.getElementById('filterSender')?.value || '',
                    update: document.getElementById('filterUpdate')?.value || '',
                    currentPage
                }));
            } catch (error) { }
        }

        function restoreFollowerUiState() {
            let state = null;
            try {
                state = JSON.parse(localStorage.getItem(FOLLOWER_UI_STATE_KEY) || 'null');
            } catch (error) {
                state = null;
            }

            if (!state) return;

            const searchInput = document.getElementById('searchInput');
            const filterRep = document.getElementById('filterRep');
            const filterStatus = document.getElementById('filterStatus');
            const filterZone = document.getElementById('filterZone');
            const filterSender = document.getElementById('filterSender');
            const filterUpdate = document.getElementById('filterUpdate');

            if (searchInput) searchInput.value = state.search || '';
            if (filterRep) filterRep.value = state.rep || '';
            if (filterStatus) filterStatus.value = state.status || '';
            if (filterZone) filterZone.value = state.zone || '';
            if (filterSender) filterSender.value = state.sender || '';
            if (filterUpdate) filterUpdate.value = state.update || '';
            currentPage = Number(state.currentPage) || 1;
        }

        let filterDebounceTimer;
        function debouncedFilterData() {
            clearTimeout(filterDebounceTimer);
            filterDebounceTimer = setTimeout(() => {
                const searchInput = document.getElementById('searchInput');
                const val = (searchInput?.value || '').trim();
                if (val.length > 0 && val.length < 3) return; // Do not apply search yet
                filterData();
            }, 350);
        }

        function filterData() {
            currentPage = 1;
            populateFilters();
            renderTable();
            saveFollowerUiState();
        }

        async function fetchShipments() {
            const { data, error } = await supabaseClient
                .from(CONFIG.TABLES.SHIPMENTS)
                .select('*')
                .order('كود الشحنة', { ascending: false });

            if (error) {
                console.error(error);
                Swal.fire('خطأ', 'فشل في تحميل البيانات', 'error');
                return;
            }

            allShipments = (data || []).map(normalizeShipmentPriceField);
            await loadRepContacts();
            restoreFollowerUiState();
            populateFilters();
            renderTable();
        }

        function normalizeWhatsAppPhone(phone) {
            let normalized = String(phone || '').replace(/\D/g, '');
            if (!normalized) return '';
            if (normalized.startsWith('00')) normalized = normalized.slice(2);
            if (normalized.startsWith('0')) normalized = `2${normalized}`;
            return normalized;
        }

        function normalizeComparableValue(value) {
            return String(value ?? '').trim().toLowerCase();
        }

        async function loadRepContacts() {
            const { data, error } = await supabaseClient
                .from(CONFIG.TABLES.USERS)
                .select('username, phone, role, approved');

            if (error) {
                console.error(error);
                repContactsMap = new Map();
                return;
            }

            const contactMap = new Map();
            (data || []).forEach((account) => {
                const role = String(account?.role || '').trim();
                const isRepAccount = role === 'rep' || role === 'مندوب فرعي';
                if (!isRepAccount || account?.approved === false) return;

                const phone = normalizeWhatsAppPhone(account?.phone);
                if (!phone) return;

                [account?.username, account?.phone].forEach((key) => {
                    const normalizedKey = normalizeComparableValue(key);
                    if (normalizedKey) contactMap.set(normalizedKey, phone);
                });
            });

            repContactsMap = contactMap;
        }

        function getShipmentRepWhatsAppPhone(shipment) {
            const repKeys = [
                shipment?.المندوب,
                shipment?.['المندوب الفرعي'],
                shipment?.['المندوب الرعي']
            ];

            for (const key of repKeys) {
                const normalizedKey = normalizeComparableValue(key);
                if (!normalizedKey) continue;
                const phone = repContactsMap.get(normalizedKey);
                if (phone) return phone;
            }

            return '';
        }

        function formatLastContactAt(value) {
            if (!value) return '';
            const parsed = new Date(value);
            if (Number.isNaN(parsed.getTime())) return '';
            return parsed.toLocaleString('ar-EG', {
                dateStyle: 'short',
                timeStyle: 'short'
            });
        }

        async function recordShipmentContactAttempt(shipmentId, options = {}) {
            const shipment = getShipmentById(shipmentId);
            if (!shipment) return false;

            const attempts = getShipmentCallAttempts(shipment) + 1;
            const attemptedAt = new Date().toISOString();
            const method = options.method || 'تسجيل تواصل';

            const { error } = await supabaseClient
                .from(CONFIG.TABLES.SHIPMENTS)
                .update({
                    call_attempts: attempts,
                    last_contact_at: attemptedAt,
                    last_contact_method: method
                })
                .eq('id', Number(shipmentId) || shipmentId);

            if (!error) {
                shipment['عدد المحاولات'] = attempts;
                shipment.call_attempts = attempts;
                shipment['آخر محاولة تواصل'] = attemptedAt;
                shipment.last_contact_at = attemptedAt;
                shipment['آخر وسيلة تواصل'] = method;
                shipment.last_contact_method = method;
                renderTable();
            } else {
                console.warn('تعذر تحديث عدد المحاولات:', error.message || error);
            }

            if (CONFIG.TABLES.CALLS_LOG) {
                const { error: logError } = await supabaseClient
                    .from(CONFIG.TABLES.CALLS_LOG)
                    .insert({
                        shipment_code: shipment['كود الشحنة'] || shipment.order_id || null,
                        rep_name: shipment.المندوب || null,
                        method,
                        result: options.result || 'opened',
                        created_at: attemptedAt
                    });

                if (logError) {
                    console.warn('تعذر حفظ سجل التواصل:', logError.message || logError);
                }
            }

            return !error;
        }

        const CONTACT_RESULT_PRESETS = {
            whatsapp: [
                'تم التواصل واتساب',
                'الرقم غير مسجل واتساب',
                'رقم غير صحيح'
            ],
            call: [
                'تم الرد',
                'لم يرد',
                'رقم غير صحيح'
            ],
            manual: [
                'تم الرد',
                'لم يرد',
                'تم التواصل واتساب',
                'الرقم غير مسجل واتساب',
                'رقم غير صحيح'
            ]
        };
        let pendingContactOutcomePrompt = null;
        let isContactOutcomePromptOpen = false;

        function getContactResultOptions(method) {
            const normalizedMethod = String(method || '').trim();
            if (normalizedMethod.includes('واتساب')) {
                return {
                    title: 'ما نتيجة التواصل عبر واتساب؟',
                    options: CONTACT_RESULT_PRESETS.whatsapp
                };
            }

            if (normalizedMethod.includes('اتصال')) {
                return {
                    title: 'ما نتيجة الاتصال؟',
                    options: CONTACT_RESULT_PRESETS.call
                };
            }

            return {
                title: 'ما نتيجة التواصل؟',
                options: CONTACT_RESULT_PRESETS.manual
            };
        }

        async function promptForContactOutcome(context) {
            if (!context || isContactOutcomePromptOpen) return;
            isContactOutcomePromptOpen = true;

            try {
                const shipment = getShipmentById(context.shipmentId);
                if (!shipment) return;
                const { title, options } = getContactResultOptions(context.method);

                const { value: result } = await Swal.fire({
                    title,
                    html: `
                        <div class="space-y-3 text-right" dir="rtl">
                            <p class="text-sm font-bold text-slate-600">الشحنة: <span class="text-slate-900">#${shipment.order_id || shipment['كود الشحنة'] || shipment.id}</span></p>
                            <select id="swal-contact-result" class="swal2-input !m-0 !w-full border border-slate-200 rounded-lg">
                                <option value="">اختر النتيجة</option>
                                ${options.map((option) => `<option value="${option}">${option}</option>`).join('')}
                            </select>
                        </div>
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'حفظ المحاولة',
                    cancelButtonText: 'تخطي',
                    preConfirm: () => {
                        const selectedResult = document.getElementById('swal-contact-result')?.value || '';
                        if (!selectedResult) {
                            Swal.showValidationMessage('يرجى اختيار نتيجة التواصل');
                            return false;
                        }
                        return selectedResult;
                    }
                });

                if (!result) return;

                const success = await recordShipmentContactAttempt(context.shipmentId, {
                    method: context.method,
                    result
                });

                if (success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'تم تسجيل نتيجة التواصل',
                        toast: true,
                        position: 'top-end',
                        showConfirmButton: false,
                        timer: 1800
                    });
                }
            } finally {
                isContactOutcomePromptOpen = false;
            }
        }

        function queueContactOutcomePrompt(context) {
            pendingContactOutcomePrompt = {
                ...context,
                queuedAt: Date.now()
            };
        }

        async function flushPendingContactOutcomePrompt() {
            if (!pendingContactOutcomePrompt || isContactOutcomePromptOpen) return;
            const context = pendingContactOutcomePrompt;
            pendingContactOutcomePrompt = null;
            await promptForContactOutcome(context);
        }

        function openContactChannelAndWaitForOutcome(context, openCallback) {
            queueContactOutcomePrompt(context);
            openCallback();
        }

        function openRepWhatsApp(shipmentId) {
            const shipment = getShipmentById(shipmentId);
            if (!shipment) return;

            const phone = getShipmentRepWhatsAppPhone(shipment);
            if (!phone) {
                Swal.fire('تنبيه', 'رقم واتساب المندوب غير متوفر لهذه الشحنة', 'warning');
                return;
            }

            openContactChannelAndWaitForOutcome({
                shipmentId,
                method: 'واتساب المندوب'
            }, () => {
                window.open(`https://wa.me/${phone}`, '_blank');
            });
        }

        function populateFilters() {
            const currentRep = document.getElementById('filterRep').value;
            const currentZone = document.getElementById('filterZone').value;
            const currentSender = document.getElementById('filterSender').value;
            const currentUpdate = document.getElementById('filterUpdate').value;
            const currentStatus = document.getElementById('filterStatus')?.value || '';

            const repsData = allShipments.filter(s => (!currentZone || s.الزون === currentZone) && (!currentSender || s.الراسل === currentSender) && (!currentUpdate || getShipmentDailyValue(s) === currentUpdate) && (!currentStatus || getShipmentDisplayStatus(s) === currentStatus));
            const reps = [...new Set(repsData.map(s => s.المندوب).filter(Boolean))].sort();

            const zonesData = allShipments.filter(s => (!currentRep || s.المندوب === currentRep) && (!currentSender || s.الراسل === currentSender) && (!currentUpdate || getShipmentDailyValue(s) === currentUpdate) && (!currentStatus || getShipmentDisplayStatus(s) === currentStatus));
            const zones = [...new Set(zonesData.map(s => s.الزون).filter(Boolean))].sort();

            const sendersData = allShipments.filter(s => (!currentRep || s.المندوب === currentRep) && (!currentZone || s.الزون === currentZone) && (!currentUpdate || getShipmentDailyValue(s) === currentUpdate) && (!currentStatus || getShipmentDisplayStatus(s) === currentStatus));
            const senders = [...new Set(sendersData.map(s => s.الراسل).filter(Boolean))].sort();

            const updatesData = allShipments.filter(s => (!currentRep || s.المندوب === currentRep) && (!currentZone || s.الزون === currentZone) && (!currentSender || s.الراسل === currentSender) && (!currentStatus || getShipmentDisplayStatus(s) === currentStatus));
            const updates = [...new Set(updatesData.map(s => getShipmentDailyValue(s)).filter(Boolean))].sort().reverse();

            const statusesData = allShipments.filter(s => (!currentRep || s.المندوب === currentRep) && (!currentZone || s.الزون === currentZone) && (!currentSender || s.الراسل === currentSender) && (!currentUpdate || getShipmentDailyValue(s) === currentUpdate));
            const statuses = [...new Set(statusesData.map(s => getShipmentDisplayStatus(s)).filter(Boolean))].sort();

            fillSelect('filterRep', reps);
            fillSelect('filterStatus', statuses);
            fillSelect('filterZone', zones);
            fillSelect('filterSender', senders);

            const updateSelect = document.getElementById('filterUpdate');
            updateSelect.innerHTML = '<option value="" class="text-slate-800 bg-white">كل اليوميات</option>';
            updates.forEach(val => {
                updateSelect.innerHTML += `<option value="${val}" class="text-slate-800 bg-white">${val}</option>`;
            });
            updateSelect.value = currentUpdate;
        }

        function fillSelect(id, values) {
            const select = document.getElementById(id);
            const current = select.value;
            select.innerHTML = select.options[0].outerHTML; // Keep first default option
            values.forEach(val => {
                select.innerHTML += `<option value="${val}">${val}</option>`;
            });
            if (id === 'filterUpdate') {
                const savedDate = getSavedDateFilter();
                select.value = current || (savedDate && values.includes(savedDate) ? savedDate : '');
            } else {
                select.value = current;
            }
        }

        function isPriceEditShipment(shipment) {
            const normalizedStatus = String(shipment?.الحالة || '').trim();
            const normalizedReason = String(shipment?.['سبب الحالة'] || shipment?.سبب_الحالة || '').trim();
            return normalizedStatus === 'تعديل سعر' || normalizedReason === 'تعديل سعر' || normalizedReason === 'شحن';
        }

        function isPendingStatus(status) {
            const normalizedStatus = String(status || '').trim();
            return normalizedStatus === '' || normalizedStatus === 'قيد' || normalizedStatus === 'قيد التنفيذ' || normalizedStatus === 'قيد التوصيل';
        }

        function isRejectedStatus(status) {
            const normalizedStatus = String(status || '').trim();
            return normalizedStatus === 'رفض' || normalizedStatus === 'الغاء' || normalizedStatus === 'إلغاء';
        }

        function getShipmentDisplayStatus(shipment) {
            const normalizedStatus = String(shipment?.الحالة || '').trim();
            if (isPriceEditShipment(shipment)) return 'تعديل سعر';
            if (isPendingStatus(normalizedStatus)) return 'قيد التوصيل';
            if (normalizedStatus === 'تأجيل' || normalizedStatus === 'مؤجل') return 'مؤجل';
            if (isRejectedStatus(normalizedStatus)) return 'رفض';
            if (normalizedStatus === 'تم' || normalizedStatus === 'تم التسليم') return 'تم التوصيل';
            return normalizedStatus || 'قيد التوصيل';
        }

        function getShipmentDisplayReason(shipment) {
            if (isPriceEditShipment(shipment)) return 'تعديل سعر';
            return shipment['سبب الحالة'] || shipment.سبب_الحالة || '---';
        }

        function renderTable() {
            const fRep = document.getElementById('filterRep').value;
            const fStatus = document.getElementById('filterStatus')?.value || '';
            const fZone = document.getElementById('filterZone').value;
            const fSender = document.getElementById('filterSender').value;
            const fUpdate = document.getElementById('filterUpdate').value;
            const searchQ = document.getElementById('searchInput').value.trim().toLowerCase();
            const tbody = document.getElementById('shipmentsTableBody');
            const pagination = document.getElementById('paginationContainer');

            if (!fUpdate) {
                tbody.innerHTML = `<tr><td colspan="11" class="text-center p-8 text-amber-600 font-bold">يرجى اختيار فلتر اليومية أولاً لعرض الشحنات</td></tr>`;
                pagination.innerHTML = '';
                saveFollowerUiState();
                return;
            }

            const filtered = allShipments.filter(s => {
                if (fRep && s.المندوب !== fRep) return false;
                if (fStatus && getShipmentDisplayStatus(s) !== fStatus) return false;
                if (fZone && s.الزون !== fZone) return false;
                if (fSender && s.الراسل !== fSender) return false;
                if (fUpdate && getShipmentDailyValue(s) !== fUpdate) return false;

                if (searchQ && searchQ.length >= 3) {
                    const matchOrderId = String(s.order_id || '').toLowerCase().includes(searchQ);
                    const matchName = String(s.اسم_العميل || '').toLowerCase().includes(searchQ);
                    const matchPhone = String(s.الهاتف || '').toLowerCase().includes(searchQ);
                    const matchAltPhone = String(s.هاتف_بديل || '').toLowerCase().includes(searchQ);

                    if (!matchOrderId && !matchName && !matchPhone && !matchAltPhone) {
                        return false;
                    }
                }

                return true;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="text-center p-8 text-slate-500 font-bold">لا توجد شحنات مطابقة للفلاتر</td></tr>`;
                pagination.innerHTML = '';
                saveFollowerUiState();
                return;
            }

            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const paginated = filtered.slice(startIndex, startIndex + itemsPerPage);

            tbody.innerHTML = paginated.map(s => `
                <tr class="transition-colors">
                    <td class="p-3 text-sm font-bold text-slate-800 cell-compact">${s.اسم_العميل || '---'}</td>
                    <td class="p-3 text-xs text-slate-600 leading-relaxed cell-compact">${s.العنوان || '---'}</td>
                    <td class="p-3 text-sm text-slate-700 cell-compact">${s.المنتج || '---'}</td>
                    <td class="p-3 text-sm font-black text-indigo-600 cell-compact">${s.المبلغ || '0'} ج</td>
                    <td class="p-3">
                        <div class="flex flex-wrap items-start gap-2">
                            <span class="text-sm font-black text-slate-700 dark:text-slate-200 cell-compact flex-1 min-w-0">${s.المندوب || 'غير محدد'}</span>
                            <button type="button" onclick="openRepWhatsApp('${s.id}')" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-[#25D366] text-white shadow-md transition-colors hover:bg-[#1ebd5a]" title="واتساب المندوب" aria-label="واتساب المندوب">
                                <i class="fab fa-whatsapp"></i>
                            </button>
                        </div>
                    </td>
                    <td class="p-3 ">
                        <span class="inline-block px-2.5 py-1 rounded-xl bg-slate-100 text-slate-700 text-xs font-black dark:bg-slate-800 dark:text-slate-100">${getShipmentDisplayStatus(s)}</span>
                    </td>
                    <td class="p-3 text-xs text-slate-600 cell-compact">${getShipmentDisplayReason(s)}</td>
                    <td class="p-3 text-xs text-slate-600">
                        <div class="flex flex-col gap-1">
                            <span class="inline-flex w-fit items-center rounded-full bg-amber-50 dark:bg-amber-950/30 px-2 py-1 font-black text-amber-700 dark:text-amber-300 border border-amber-100 dark:border-amber-900/40">${getShipmentCallAttempts(s)} محاولة</span>
                            <span class="text-[10px] text-slate-400 cell-compact">${[getShipmentLastContactMethod(s), formatLastContactAt(getShipmentLastContactAt(s))].filter(Boolean).join(' • ') || 'لا يوجد سجل تواصل بعد'}</span>
                        </div>
                    </td>
                    <td class="p-3 text-xs text-slate-500 cell-compact">${s.ملاحظات || '---'}</td>
                    <td class="p-3 text-sm font-black text-emerald-600 cell-compact">${s.السعر_بعد_التعديل || '---'}</td>
                    <td class="p-3 text-center">
                        <div class="flex items-center justify-center gap-2 flex-wrap">
                            ${renderShipmentContactActions(s)}
                            <button onclick="toggleShipmentMenu(event, '${s.id}')" class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-200 shadow-sm transition-colors hover:text-indigo-600" title="خيارات الشحنة" aria-label="خيارات الشحنة">
                                <i class="fas fa-ellipsis-v"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');

            renderPagination(totalPages);
            saveFollowerUiState();
        }

        document.getElementById('filterUpdate').addEventListener('change', (event) => {
            saveDateFilter(event.target.value);
        });

        function renderPagination(totalPages) {
            const container = document.getElementById('paginationContainer');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';

            if (currentPage > 1) {
                html += `<button onclick="goToPage(${currentPage - 1})" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors flex items-center justify-center font-bold text-sm shadow-sm"><i class="fas fa-chevron-left text-xs"></i></button>`;
            }

            let startP = Math.max(1, currentPage - 2);
            let endP = Math.min(totalPages, currentPage + 2);

            if (startP > 1) {
                html += `<button onclick="goToPage(1)" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors flex items-center justify-center font-bold text-sm shadow-sm">1</button>`;
                if (startP > 2) html += `<span class="px-1 py-1 text-slate-400">...</span>`;
            }

            for (let i = startP; i <= endP; i++) {
                if (i === currentPage) {
                    html += `<button class="w-8 h-8 rounded-lg bg-indigo-600 border border-indigo-600 text-white font-bold flex items-center justify-center text-sm shadow-md pointer-events-none">${i}</button>`;
                } else {
                    html += `<button onclick="goToPage(${i})" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors flex items-center justify-center font-bold text-sm shadow-sm">${i}</button>`;
                }
            }

            if (endP < totalPages) {
                if (endP < totalPages - 1) html += `<span class="px-1 py-1 text-slate-400">...</span>`;
                html += `<button onclick="goToPage(${totalPages})" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors flex items-center justify-center font-bold text-sm shadow-sm">${totalPages}</button>`;
            }

            if (currentPage < totalPages) {
                html += `<button onclick="goToPage(${currentPage + 1})" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors flex items-center justify-center font-bold text-sm shadow-sm"><i class="fas fa-chevron-right text-xs"></i></button>`;
            }

            container.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            renderTable();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            saveFollowerUiState();
        }

        function getShipmentById(id) {
            return allShipments.find(s => String(s.id) === String(id));
        }

        function getShipmentPhone(shipment, key) {
            return (shipment[key] || '').toString().trim();
        }

        function hasShipmentPhone(shipment, key) {
            return Boolean(getShipmentPhone(shipment, key));
        }

        function renderShipmentContactActions(shipment) {
            const primary = hasShipmentPhone(shipment, 'الهاتف') ? `
                <button onclick="openCustomerWhatsApp('${shipment.id}', 'الهاتف')" class="bg-[#25D366] text-white p-2 rounded-xl shadow-md hover:bg-[#1ebd5a] transition-colors focus:ring-2 focus:ring-[#25D366] focus:ring-offset-1 tooltip" title="واتساب الهاتف">
                    <i class="fab fa-whatsapp text-lg"></i>
                </button>
                <button type="button" onclick="initiateCustomerCall('${shipment.id}', 'الهاتف')" class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-300 shadow-sm transition-colors hover:text-indigo-700" title="اتصال الهاتف" aria-label="اتصال الهاتف">
                    <i class="fas fa-phone-alt"></i>
                </button>
            ` : '';

            const secondary = hasShipmentPhone(shipment, 'هاتف بديل') ? `
                <button onclick="openCustomerWhatsApp('${shipment.id}', 'هاتف بديل')" class="bg-[#25D366] text-white p-2 rounded-xl shadow-md hover:bg-[#1ebd5a] transition-colors focus:ring-2 focus:ring-[#25D366] focus:ring-offset-1 tooltip" title="واتساب الهاتف البديل">
                    <i class="fab fa-whatsapp text-lg"></i>
                </button>
                <button type="button" onclick="initiateCustomerCall('${shipment.id}', 'هاتف بديل')" class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-300 shadow-sm transition-colors hover:text-indigo-700" title="اتصال الهاتف البديل" aria-label="اتصال الهاتف البديل">
                    <i class="fas fa-phone-alt"></i>

            return `${primary}${secondary}`;

        function formatShipmentCopyText(shipment) {
            const getValue = (value) => {
                if (value === null || value === undefined || value === '') return '---';
                return String(value);
            };

            return [
                `اسم العميل: ${getValue(shipment.اسم_العميل)}`,
                `العنوان: ${getValue(shipment.العنوان)}`,
                `الزون: ${getValue(shipment.الزون)}`,
                `المنتج: ${getValue(shipment.المنتج)}`,
                `الهاتف: ${getValue(shipment.الهاتف)}`,
                `هاتف بديل: ${getValue(shipment.هاتف_بديل)}`,
                `المبلغ: ${getValue(shipment.المبلغ)}`,
                `الكود: ${getValue(shipment.الكود)}`,
                `الراسل: ${getValue(shipment.الراسل)}`,
                `المندوب: ${getValue(shipment.المندوب)}`,
                `عدد المحاولات: ${getShipmentCallAttempts(shipment)}`
            ].join('\n');
        }

        function closeShipmentMenu() {
            const menu = document.getElementById('shipmentMenu');
            menu.classList.add('hidden');
            activeShipmentMenuId = null;
        }

        function toggleShipmentMenu(event, shipmentId) {
            event.stopPropagation();
            const menu = document.getElementById('shipmentMenu');
            const isOpenForSameShipment = activeShipmentMenuId === shipmentId && !menu.classList.contains('hidden');

            if (isOpenForSameShipment) {
                closeShipmentMenu();
                return;
            }

            activeShipmentMenuId = shipmentId;
            menu.classList.remove('hidden');

            const menuWidth = 220;
            const menuHeight = 64;
            const left = Math.max(12, Math.min(event.clientX - menuWidth + 20, window.innerWidth - menuWidth - 12));
            const top = Math.max(12, Math.min(event.clientY + 12, window.innerHeight - menuHeight - 12));

            menu.style.left = `${left}px`;
            menu.style.top = `${top}px`;
        }

        async function copyShipmentData(id) {
            const shipment = getShipmentById(id);
            if (!shipment) return;

            try {
                await navigator.clipboard.writeText(formatShipmentCopyText(shipment));
                closeShipmentMenu();
                Swal.fire({
                    icon: 'success',
                    title: 'تم نسخ بيانات الشحنة',
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 1800
                });
            } catch (error) {
                closeShipmentMenu();
                Swal.fire('خطأ', 'فشل نسخ بيانات الشحنة', 'error');
            }
        }

        function copyShipmentDataFromMenu() {
            if (!activeShipmentMenuId) return;
            copyShipmentData(activeShipmentMenuId);
        }

        async function logShipmentContactAttemptFromMenu() {
            if (!activeShipmentMenuId) return;
            const shipmentId = activeShipmentMenuId;
            closeShipmentMenu();
            await promptForContactOutcome({
                shipmentId,
                method: 'تسجيل يدوي'
            });
        }

        async function openCustomerWhatsApp(shipmentId, phoneKey = 'الهاتف') {
            const shipment = getShipmentById(shipmentId);
            if (!shipment) return;

            // Template: اسم العميل، العنوان، الزون، المنتج، الهاتف، هاتف بديل، المبلغ، المكتب، الكود، والمندوب
            const info = [
                `📦 *بيانات الشحنة:* #${shipment.order_id || '---'}`,
                `👤 *العميل:* ${shipment.اسم_العميل || '---'}`,
                `📍 *العنوان:* ${shipment.العنوان || '---'}`,
                `🗺️ *الزون:* ${shipment.الزون || '---'}`,
                `🛍️ *المنتج:* ${shipment.المنتج || '---'}`,
                `💰 *المبلغ المطلوب:* ${shipment.المبلغ ? shipment.المبلغ + ' ج.م' : '---'}`,
                `📱 *هاتف 1:* ${shipment.الهاتف || '---'}`,
                `📱 *هاتف 2:* ${shipment.هاتف_بديل || '---'}`,
                `🏢 *المكتب (الراسل):* ${shipment.الراسل || '---'}`,
                `🚚 *المندوب:* ${shipment.المندوب || 'غير محدد'}`
            ].join('\n');

            try {
                await navigator.clipboard.writeText(info);

                // Construct WA link (prefer primary phone, format number if needed)
                let tel = getShipmentPhone(shipment, phoneKey);
                // Simple format to add +20 if it's an Egyptian 010/011/etc
                if (tel.startsWith('01') && tel.length === 11) {
                    tel = '+20' + tel.substring(1);
                } else {
                    tel = tel.replace(/\D/g, '');
                }

                const waUrl = tel ?
                    `https://wa.me/${tel}?text=${encodeURIComponent(info)}` :
                    `https://wa.me/?text=${encodeURIComponent(info)}`; // fallback to contact picker

                openContactChannelAndWaitForOutcome({
                    shipmentId,
                    method: phoneKey === 'هاتف بديل' ? 'واتساب هاتف بديل' : 'واتساب العميل'
                }, () => {
                    window.open(waUrl, '_blank');
                });
            } catch (err) {
                console.error('Failed to copy: ', err);
                Swal.fire('خطأ', 'فشل في نسخ بيانات الشحنة', 'error');
            }
        }

        function initiateCustomerCall(shipmentId, phoneKey = 'الهاتف') {
            const shipment = getShipmentById(shipmentId);
            if (!shipment) return;

            const phone = getShipmentPhone(shipment, phoneKey);
            if (!phone) {
                Swal.fire('تنبيه', 'رقم الهاتف غير متوفر', 'warning');
                return;
            }

            openContactChannelAndWaitForOutcome({
                shipmentId,
                method: phoneKey === 'هاتف بديل' ? 'اتصال هاتف بديل' : 'اتصال العميل'
            }, () => {
                window.location.href = `tel:${phone}`;
            });
        }

        function logout() {
            clearStoredUserSession('../index.html');
        }

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark');
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = isDark ? 'fas fa-sun text-xl' : 'fas fa-moon text-xl';
            localStorage.setItem('rep-theme', isDark ? 'dark' : 'light');
        }

        document.addEventListener('click', (event) => {
            const menu = document.getElementById('shipmentMenu');
            if (!menu.contains(event.target)) {
                closeShipmentMenu();
            }
        });
        window.addEventListener('focus', () => {
            setTimeout(() => {
                flushPendingContactOutcomePrompt();
            }, 250);
        });
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                setTimeout(() => {
                    flushPendingContactOutcomePrompt();
                }, 250);
            }
        });
        window.addEventListener('resize', closeShipmentMenu);
        window.addEventListener('scroll', closeShipmentMenu);

        if (localStorage.getItem('rep-theme') === 'dark') {
            document.body.classList.add('dark');
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = 'fas fa-sun text-xl';
        }

        // Real-time updates
        supabaseClient
            .channel('follower_shipments')
            .on('postgres_changes', { event: '*', schema: 'public', table: CONFIG.TABLES.SHIPMENTS }, payload => {
                fetchShipments(); // Refresh all on any change
            })
            .subscribe();

        // Initial Load
        fetchShipments();
    </script>
</body>

</html>
