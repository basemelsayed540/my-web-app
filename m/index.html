<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://evrqxgnqwngokukqerps.supabase.co https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), browsing-topics=()">
    <title>تسجيل دخول الراسل والمتابعة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background:
                radial-gradient(circle at top right, rgba(99, 102, 241, 0.12), transparent 24rem),
                radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.08), transparent 22rem),
                linear-gradient(180deg, #fbfdff 0%, #f4f7fb 100%);
            min-height: 100vh;
        }

        body.dark {
            background:
                radial-gradient(circle at top right, rgba(99, 102, 241, 0.16), transparent 20rem),
                linear-gradient(180deg, #020617 0%, #0b1120 100%);
        }

        .login-shell {
            position: relative;
            overflow: hidden;
        }

        .login-shell::before {
            content: "";
            position: absolute;
            inset: -15% auto auto -10%;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.14), transparent 70%);
            pointer-events: none;
        }

        .login-shell::after {
            content: "";
            position: absolute;
            inset: auto -12% -18% auto;
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.16), transparent 70%);
            pointer-events: none;
        }

        .hero-badge {
            background: rgba(255, 255, 255, 0.74);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.86);
        }

        .dark .hero-badge {
            background: rgba(15, 23, 42, 0.74);
            border-color: rgba(148, 163, 184, 0.14);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .login-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(248, 250, 252, 0.92));
            border: 1px solid rgba(226, 232, 240, 0.88);
            box-shadow: 0 24px 58px rgba(15, 23, 42, 0.12);
        }

        .dark .login-card {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.94), rgba(15, 23, 42, 0.88));
            border-color: rgba(51, 65, 85, 0.88);
            box-shadow: 0 30px 64px rgba(2, 6, 23, 0.5);
        }

        .soft-control {
            background: rgba(255, 255, 255, 0.84);
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 12px 26px rgba(15, 23, 42, 0.05);
        }

        .dark .soft-control {
            background: rgba(15, 23, 42, 0.9);
            border-color: rgba(148, 163, 184, 0.16);
        }

        .swal2-popup {
            border-radius: 1.6rem !important;
            border: 1px solid rgba(226, 232, 240, 0.9) !important;
            box-shadow: 0 24px 54px rgba(15, 23, 42, 0.16) !important;
            padding-top: 1.4rem !important;
        }

        .swal2-title {
            font-weight: 900 !important;
            color: #0f172a !important;
        }

        .swal2-html-container {
            color: #475569 !important;
            font-weight: 700 !important;
        }

        .swal2-confirm {
            background: linear-gradient(135deg, #4f46e5, #6366f1) !important;
            border-radius: 0.9rem !important;
            font-weight: 900 !important;
            box-shadow: 0 14px 24px rgba(79, 70, 229, 0.24) !important;
        }

        body.dark .swal2-popup {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.94)) !important;
            border-color: rgba(51, 65, 85, 0.92) !important;
            box-shadow: 0 28px 60px rgba(2, 6, 23, 0.56) !important;
        }

        body.dark .swal2-title,
        body.dark .swal2-html-container {
            color: #e2e8f0 !important;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <div class="absolute top-4 left-4 z-50">
        <button onclick="toggleTheme()" class="p-3 hero-badge rounded-full shadow-md text-slate-500 dark:text-slate-300 hover:text-indigo-600 transition-colors">
            <i id="themeIcon" class="fas fa-moon text-xl"></i>
        </button>
    </div>

    <div class="max-w-md w-full animate-fade-in">
        <div class="glass login-card login-shell p-6 sm:p-8 rounded-[2rem] relative overflow-hidden mx-2 sm:mx-0">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl"></div>

            <div class="text-center mb-8 relative z-10">
                <div class="w-20 h-20 bg-gradient-to-br from-emerald-500 via-emerald-600 to-teal-500 rounded-[1.7rem] flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-200 ring-4 ring-white/70 dark:ring-slate-900/40">
                    <i class="fas fa-users-viewfinder text-white text-3xl"></i>
                </div>
                <div class="inline-flex items-center gap-2 rounded-full px-3 py-1 hero-badge mb-4">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-[11px] font-black text-emerald-700 dark:text-emerald-300">بوابة دخول احترافية</span>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-800 dark:text-white mb-2">تطبيق الراسل والمتابعة</h1>
                <p class="text-slate-500 dark:text-slate-400 font-semibold">دخول مستقل للراسل وقسم المتابعة</p>
            </div>

            <div class="rounded-2xl border border-emerald-100 bg-emerald-50/90 px-4 py-3 text-sm font-bold text-emerald-700 dark:border-emerald-900/50 dark:bg-emerald-950/40 dark:text-emerald-300 mb-6 relative z-10 shadow-sm">
                هذه الصفحة مخصصة لتسجيل دخول <span class="font-black">الراسل</span> و<span class="font-black">المتابعة</span> فقط.
            </div>

            <form id="loginForm" class="space-y-6 relative z-10">
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 mr-1">رقم الموبايل</label>
                    <input type="text" id="phone" name="phone" required class="input-field soft-control bg-white dark:bg-slate-800 text-slate-900 dark:text-white border-slate-200 dark:border-slate-700 w-full py-4 px-4 text-base rounded-2xl" placeholder="01xxxxxxxxx">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 mr-1">كلمة المرور</label>
                    <input type="password" id="password" name="password" required class="input-field soft-control bg-white dark:bg-slate-800 text-slate-900 dark:text-white border-slate-200 dark:border-slate-700 w-full py-4 px-4 text-base rounded-2xl" placeholder="••••••••">
                </div>

                <div class="flex items-center justify-between px-1">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded text-emerald-600 border-slate-300 focus:ring-emerald-500">
                        <span class="text-sm font-semibold text-slate-600 group-hover:text-slate-800 transition-colors">تذكرني</span>
                    </label>
                </div>

                <button type="submit" id="loginBtn" class="w-full py-4 rounded-2xl btn-primary flex items-center justify-center gap-2 text-xl font-black mt-2 mb-4 active:scale-95 transition-transform shadow-xl">
                    <span>تسجيل الدخول</span>
                    <i class="fas fa-arrow-left"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script>
        const { createClient } = supabase;
        const supabaseClient = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const rememberMeCheckbox = document.getElementById('rememberMe');

        window.addEventListener('DOMContentLoaded', () => {
            const savedPhone = localStorage.getItem('savedPhone');
            const savedPassword = localStorage.getItem('savedPassword');
            if (savedPhone && savedPassword) {
                document.getElementById('phone').value = savedPhone;
                document.getElementById('password').value = savedPassword;
                if (rememberMeCheckbox) rememberMeCheckbox.checked = true;
            }
        });

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark');
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = isDark ? 'fas fa-sun text-xl' : 'fas fa-moon text-xl';
            localStorage.setItem('rep-theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('rep-theme') === 'dark') {
            document.body.classList.add('dark');
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = 'fas fa-sun text-xl';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = 'جاري التحقق...';

            try {
                const loginResult = await invokeUsersAuthAction('login', { phone, password });
                const data = loginResult?.user;
                if (!data) throw new Error('تعذر إنشاء جلسة تسجيل الدخول.');

                if (!['sender', 'follower'].includes(data.role)) {
                    throw new Error('هذه الصفحة مخصصة فقط لحسابات الراسل والمتابعة.');
                }

                saveUserSession(data, loginResult.sessionToken || '');

                if (rememberMeCheckbox && rememberMeCheckbox.checked) {
                    localStorage.setItem('savedPhone', phone);
                    localStorage.setItem('savedPassword', password);
                } else {
                    localStorage.removeItem('savedPhone');
                    localStorage.removeItem('savedPassword');
                }

                Swal.fire({
                    icon: 'success',
                    title: 'تم تسجيل الدخول بنجاح',
                    text: `مرحباً بك، ${data.full_name || data.username}`,
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    if (data.role === 'sender') window.location.href = 'sender.html';
                    else if (data.role === 'follower') window.location.href = 'follower.html';
                });
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'فشل الدخول',
                    text: err.message
                });
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'تسجيل الدخول';
            }
        });
    </script>
</body>
</html>
