<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سجل أخطاء النظام | صيانة التطبيق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="assets/js/shared/theme.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .log-card { transition: all 0.3s ease; }
        .log-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen pb-10">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800 p-4 mb-6 shadow-sm">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="login.html" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300">
                    <i class="fas fa-arrow-right"></i>
                </a>
                <div>
                    <h1 class="text-lg font-black text-slate-900 dark:text-white leading-none">مركز الصيانة</h1>
                    <p class="text-[10px] font-bold text-slate-500 mt-1">مراقبة الأخطاء التقنية للبرنامج</p>
                </div>
            </div>
            <button onclick="clearLogs()" class="px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white text-xs font-black rounded-xl shadow-lg shadow-rose-200 dark:shadow-none transition-all active:scale-95">
                مسح السجل
            </button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4">

        <!-- Stats Summary -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 shadow-sm">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-1">إجمالي الأخطاء</p>
                <h2 id="totalLogs" class="text-2xl font-black text-slate-900 dark:text-white">0</h2>
            </div>
            <div class="bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 shadow-sm">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-1">حالة النظام</p>
                <h2 id="systemStatus" class="text-sm font-black text-emerald-500">يعمل بكفاءة</h2>
            </div>
        </div>

        <!-- Debug Actions -->
        <div class="mb-6 flex gap-3">
            <button onclick="testCallLogAccess()" class="flex-1 px-4 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl text-[11px] font-black text-slate-700 dark:text-slate-200 shadow-sm active:scale-95 transition-all flex items-center justify-center gap-2">
                <i class="fas fa-phone-slash text-sky-500"></i>
                اختبار صلاحية سجل الهاتف
            </button>
        </div>

        <!-- Logs Container -->
        <div id="logsContainer" class="space-y-4">
            <!-- Loading State -->
            <div class="text-center py-20 opacity-20">
                <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
                <p class="font-bold">جاري جلب التقارير من الذاكرة...</p>
            </div>
        </div>
    </main>

    <script>
        const STORAGE_KEY = 'app_error_logs';
        if (typeof RepsTheme !== 'undefined') RepsTheme.apply();

        function renderLogs() {
            const container = document.getElementById('logsContainer');
            const totalEl = document.getElementById('totalLogs');
            const statusEl = document.getElementById('systemStatus');

            const logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            totalEl.innerText = logs.length;

            if (logs.length > 5) {
                statusEl.innerText = 'يوجد تنبيهات';
                statusEl.className = 'text-sm font-black text-amber-500';
            } else if (logs.length > 15) {
                statusEl.innerText = 'حالة حرجة';
                statusEl.className = 'text-sm font-black text-rose-500';
            }

            if (logs.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 bg-white dark:bg-slate-900 rounded-[2rem] border border-dashed border-slate-300 dark:border-slate-700">
                        <i class="fas fa-check-circle text-emerald-500 text-5xl mb-4 opacity-20"></i>
                        <p class="font-black text-slate-400">السجل نظيف تماماً!</p>
                        <p class="text-xs text-slate-500 mt-1">لا توجد أي أخطاء برمجية مسجلة حالياً.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = logs.map(log => {
                const isError = log.type.includes('Error');
                return `
                    <div class="log-card bg-white dark:bg-slate-900 p-5 rounded-[1.75rem] border border-slate-200 dark:border-slate-800 shadow-sm">
                        <div class="flex justify-between items-start mb-3">
                            <span class="px-3 py-1 rounded-full text-[9px] font-black ${isError ? 'bg-rose-100 text-rose-700 dark:bg-rose-950/30 dark:text-rose-300' : 'bg-amber-100 text-amber-700 dark:bg-amber-950/30 dark:text-amber-300'}">
                                ${log.type}
                            </span>
                            <div class="flex gap-2">
                                <button onclick="requestSmartFix('${btoa(unescape(encodeURIComponent(JSON.stringify(log))))}')" class="px-3 py-1.5 bg-sky-500 hover:bg-sky-600 text-white text-[9px] font-black rounded-lg shadow-sm active:scale-95 transition-all flex items-center gap-1.5">
                                    <i class="fas fa-magic"></i> إصلاح بالذكاء الاصطناعي
                                </button>
                                <span class="text-[10px] font-bold text-slate-400">${log.timestamp}</span>
                            </div>
                        </div>

                        <div class="text-sm font-black text-slate-800 dark:text-slate-100 mb-2 leading-relaxed">
                            ${log.message}
                        </div>

                        <div class="flex flex-wrap gap-2 pt-3 border-t border-slate-100 dark:border-slate-800">
                            <div class="text-[10px] font-bold text-slate-500">
                                <i class="fas fa-link ml-1 opacity-50"></i>${log.page}
                            </div>
                            ${log.source ? `
                                <div class="text-[10px] font-bold text-slate-500">
                                    <i class="fas fa-code ml-1 opacity-50"></i>${log.source}:${log.line}
                                </div>
                            ` : ''}
                        </div>

                        ${log.stack ? `
                            <details class="mt-3">
                                <summary class="text-[10px] font-black text-sky-600 cursor-pointer outline-none uppercase">عرض تفاصيل الخطأ (Stack Trace)</summary>
                                <pre class="mt-2 p-3 bg-slate-50 dark:bg-slate-950 rounded-xl text-[9px] font-mono text-slate-600 dark:text-slate-400 overflow-x-auto whitespace-pre-wrap">${log.stack}</pre>
                            </details>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function clearLogs() {
            if (confirm('هل أنت متأكد من مسح كافة التقارير؟ لا يمكن التراجع عن هذه الخطوة.')) {
                localStorage.removeItem(STORAGE_KEY);
                renderLogs();
            }
        }

        function requestSmartFix(encodedLog) {
            try {
                const log = JSON.parse(decodeURIComponent(escape(atob(encodedLog))));
                const report = `[SMART_FIX_REQUEST]\n` +
                               `Message: ${log.message}\n` +
                               `Type: ${log.type}\n` +
                               `File: ${log.source || 'Unknown'}\n` +
                               `Line: ${log.line || 'Unknown'}\n` +
                               `Page: ${log.page}\n` +
                               `Stack: ${log.stack || 'No Stack Trace'}`;

                navigator.clipboard.writeText(report).then(() => {
                    alert('✅ تم نسخ تقرير الإصلاح! أرسله لي الآن وسأقوم بإصلاحه فوراً.');
                });
            } catch (e) {
                alert('عذراً، فشل تجهيز تقرير الإصلاح.');
            }
        }

        async function testCallLogAccess() {
            if (typeof Capacitor === 'undefined') {
                alert('⚠️ اختبار سجل الهاتف يعمل فقط على التطبيق المثبت على الموبايل.');
                return;
            }

            try {
                const { CallVerification } = Capacitor.Plugins;
                if (!CallVerification) throw new Error('CallVerification Plugin not found');

                const perm = await CallVerification.requestPermissions();
                if (perm.callLog !== 'granted') {
                    alert('❌ تم رفض صلاحية الوصول لسجل المكالمات.');
                    return;
                }

                alert('✅ صلاحية سجل الهاتف مفعلة ومتاحة الآن!');
            } catch (e) {
                alert('❌ خطأ في الاتصال بنظام الأندرويد: ' + e.message);
            }
        }

        // Auto Refresh logic
        window.addEventListener('load', renderLogs);

        // Listen for new logs added from other tabs
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) renderLogs();
        });
    </script>
</body>
</html>
