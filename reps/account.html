<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://evrqxgnqwngokukqerps.supabase.co https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), browsing-topics=()">
    <title>الحساب | نظام الشحن الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .account-hero {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background:
                radial-gradient(circle at top right, rgba(99, 102, 241, 0.22), transparent 32%),
                radial-gradient(circle at bottom left, rgba(14, 165, 233, 0.16), transparent 28%),
                linear-gradient(145deg, rgba(255,255,255,0.96), rgba(248,250,252,0.9));
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.10);
        }

        .dark .account-hero {
            border-color: rgba(148, 163, 184, 0.14);
            background:
                radial-gradient(circle at top right, rgba(99, 102, 241, 0.28), transparent 32%),
                radial-gradient(circle at bottom left, rgba(56, 189, 248, 0.16), transparent 28%),
                linear-gradient(145deg, rgba(15,23,42,0.92), rgba(2,6,23,0.92));
            box-shadow: 0 24px 70px rgba(2, 6, 23, 0.48);
        }

        .account-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 0.9rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(99, 102, 241, 0.12);
            color: #4338ca;
            font-size: 0.72rem;
            font-weight: 800;
        }

        .dark .account-chip {
            background: rgba(15, 23, 42, 0.7);
            border-color: rgba(99, 102, 241, 0.24);
            color: #c7d2fe;
        }

        .hero-icon {
            width: 4rem;
            height: 4rem;
            border-radius: 1.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: linear-gradient(135deg, #4f46e5, #0ea5e9);
            box-shadow: 0 18px 40px rgba(79, 70, 229, 0.32);
        }

        .quick-action {
            width: 3rem;
            height: 3rem;
            border-radius: 1rem;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(255,255,255,0.7);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            transition: 0.25s ease;
        }

        .quick-action:hover {
            transform: translateY(-2px);
            color: #4f46e5;
            box-shadow: 0 14px 28px rgba(99, 102, 241, 0.18);
        }

        .dark .quick-action {
            background: rgba(15, 23, 42, 0.78);
            border-color: rgba(148, 163, 184, 0.14);
            color: #cbd5e1;
        }

        .account-panel {
            border: 1px solid rgba(203, 213, 225, 0.82);
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(248,250,252,0.92));
            box-shadow: 0 14px 34px rgba(15, 23, 42, 0.07);
            backdrop-filter: blur(14px);
        }

        .dark .account-panel {
            border-color: rgba(71, 85, 105, 0.9);
            background: linear-gradient(180deg, rgba(15,23,42,0.96), rgba(12,18,30,0.94));
            box-shadow: 0 20px 46px rgba(2, 6, 23, 0.5);
        }

        .info-card {
            border-radius: 1.35rem;
            border: 1px solid rgba(226, 232, 240, 0.95);
            background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,250,252,0.92));
            padding: 1rem 1.1rem;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .dark .info-card {
            border-color: rgba(51, 65, 85, 0.94);
            background: linear-gradient(180deg, rgba(30,41,59,0.96), rgba(15,23,42,0.92));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .account-form-grid {
            display: grid;
            gap: 1rem;
        }

        .account-input {
            border-radius: 1.1rem;
            border: 1px solid rgba(203, 213, 225, 0.95);
            background: rgba(255,255,255,0.94);
            transition: 0.25s ease;
        }

        .account-input:focus {
            border-color: rgba(99, 102, 241, 0.35);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.10);
        }

        .dark .account-input {
            background: rgba(15,23,42,0.94);
            border-color: rgba(71, 85, 105, 0.85);
        }

        .account-submit {
            min-height: 3.5rem;
            border-radius: 1.2rem;
            background: linear-gradient(135deg, #4f46e5, #0ea5e9);
            box-shadow: 0 18px 38px rgba(79, 70, 229, 0.24);
        }

        .bottom-dock {
            border: 1px solid rgba(148, 163, 184, 0.16);
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(20px);
            box-shadow: 0 24px 50px rgba(15, 23, 42, 0.14);
        }

        .dark .bottom-dock {
            border-color: rgba(148, 163, 184, 0.12);
            background: rgba(15,23,42,0.84);
            box-shadow: 0 24px 60px rgba(2, 6, 23, 0.48);
        }

        /* Header Styles */
        .hero-shell {
            position: relative;
            overflow: visible;
        }

        .hero-shell::before {
            content: "";
            position: absolute;
            top: -70px;
            right: -30px;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(15, 76, 129, 0.2), transparent 68%);
            pointer-events: none;
        }

        .hero-shell::after {
            content: "";
            position: absolute;
            bottom: -80px;
            left: -40px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.14), transparent 70%);
            pointer-events: none;
        }

        .header-chip {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(226, 232, 240, 0.95);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .dark .header-chip {
            background: rgba(15, 23, 42, 0.92);
            border-color: rgba(51, 65, 85, 0.92);
            box-shadow: 0 12px 26px rgba(2, 6, 23, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        #quickActionsMenu {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(226, 232, 240, 0.96);
            box-shadow: 0 20px 44px rgba(15, 23, 42, 0.12);
            backdrop-filter: blur(20px);
        }

        .dark #quickActionsMenu {
            background: rgba(15, 23, 42, 0.98);
            border-color: rgba(51, 65, 85, 0.94);
            box-shadow: 0 24px 52px rgba(2, 6, 23, 0.46);
        }

        #repNotificationsPanel > div {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.94));
            border-color: rgba(226, 232, 240, 0.96);
            box-shadow: 0 20px 42px rgba(15, 23, 42, 0.14);
        }

        .dark #repNotificationsPanel > div {
            background:
                linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.92));
            border-color: rgba(51, 65, 85, 0.94);
            box-shadow: 0 24px 52px rgba(2, 6, 23, 0.56);
        }

        #repNotificationsContainer::-webkit-scrollbar {
            width: 8px;
        }

        #repNotificationsContainer::-webkit-scrollbar-thumb {
            background: rgba(15, 76, 129, 0.3);
            border-radius: 999px;
        }
    </style>
</head>
<body class="bg-indigo-50/50 dark:bg-slate-950 min-h-screen transition-colors duration-300">

    <!-- Header -->
    <header class="hero-shell bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl sticky top-0 z-50 px-4 py-4 mb-4 border-b border-slate-200/80 dark:border-slate-800 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
            <div class="relative z-10 flex w-[98px] shrink-0 items-center justify-start gap-2">
                <button onclick="window.location.href='rep-dashboard.html'"
                    class="relative h-11 w-11 shrink-0 flex items-center justify-center rounded-2xl header-chip text-slate-500 dark:text-slate-200 hover:text-sky-800 dark:hover:text-cyan-400 transition-colors"
                    title="العودة" aria-label="العودة">
                    <i class="fas fa-arrow-right text-lg"></i>
                </button>
            </div>
            <div class="flex min-w-0 flex-1 items-center justify-center">
                <h1 class="text-base font-black text-slate-900 dark:text-white">الحساب</h1>
            </div>
            <div class="relative z-10 flex shrink-0 items-center justify-end gap-2">
                <button id="nav-btn-notifications"
                    class="relative h-11 w-11 shrink-0 flex items-center justify-center rounded-2xl header-chip text-slate-500 dark:text-slate-200 hover:text-sky-800 dark:hover:text-cyan-400 transition-colors"
                    title="الإشعارات" aria-label="الإشعارات">
                    <i class="fas fa-bell text-lg"></i>
                    <span id="repUnreadBadge"
                        class="hidden absolute top-1.5 right-1.5 min-w-4 h-4 px-1 rounded-full bg-rose-500 text-white text-[8px] font-black items-center justify-center border border-white dark:border-slate-900 leading-4">0</span>
                </button>
                <button id="gpsToggleBtn"
                    class="relative h-11 w-11 shrink-0 flex items-center justify-center rounded-2xl header-chip text-slate-500 dark:text-slate-200 hover:text-sky-800 dark:hover:text-cyan-400 transition-colors"
                    title="تفعيل صلاحية الموقع" aria-label="تفعيل صلاحية الموقع">
                    <i id="gpsToggleIcon" class="fas fa-location-dot text-lg"></i>
                </button>
                <button id="themeToggleBtn"
                    class="relative h-11 w-11 shrink-0 flex items-center justify-center rounded-2xl header-chip text-slate-500 dark:text-slate-200 hover:text-sky-800 dark:hover:text-cyan-400 transition-colors"
                    title="الوضع الليلي" aria-label="الوضع الليلي">
                    <i id="themeIcon" class="fas fa-moon text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pb-28 space-y-6">
        
        <!-- Profile Info -->
        <div class="account-panel p-6 rounded-[2rem] space-y-4">
            <h2 class="font-bold text-slate-800 dark:text-white flex items-center gap-2 mb-4">
                <i class="fas fa-id-card text-indigo-600"></i>
                البيانات الشخصية
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="info-card">
                    <p class="text-xs text-slate-500 mb-1 font-bold">الاسم</p>
                    <p class="text-sm font-black text-slate-800 dark:text-white" id="profileName">---</p>
                </div>

                <div class="info-card">
                    <p class="text-xs text-slate-500 mb-1 font-bold">رقم الهاتف</p>
                    <p class="text-sm font-black text-slate-800 dark:text-white" id="profilePhone" dir="ltr" style="text-align: right;">---</p>
                </div>
            </div>
        </div>
        
        <!-- Change Password -->
        <div class="account-panel p-6 rounded-[2rem] space-y-4">
            <h2 class="font-bold text-slate-800 dark:text-white flex items-center gap-2 mb-4">
                <i class="fas fa-lock text-indigo-600"></i>
                تغيير كلمة المرور
            </h2>
            
            <form id="changePasswordForm" class="account-form-grid" onsubmit="changePassword(event)">
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">كلمة المرور الحالية</label>
                    <div class="relative">
                        <i class="fas fa-key absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        <input type="password" id="oldPassword" required class="input-field account-input pr-12 text-sm font-semibold shadow-sm w-full" placeholder="أدخل كلمة المرور الحالية">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">كلمة المرور الجديدة</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        <input type="password" id="newPassword" required class="input-field account-input pr-12 text-sm font-semibold shadow-sm w-full" placeholder="أدخل كلمة المرور الجديدة">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">تأكيد كلمة المرور الجديدة</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        <input type="password" id="confirmPassword" required class="input-field account-input pr-12 text-sm font-semibold shadow-sm w-full" placeholder="تأكيد كلمة المرور الجديدة">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" id="submitBtn" class="w-full btn-primary account-submit py-3">
                        حفظ كلمة المرور
                    </button>
                </div>
            </form>
        </div>

        <div class="pt-4">
            <button onclick="logout()" class="w-full bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 hover:bg-rose-100 transition-colors font-bold py-4 rounded-2xl shadow-sm flex items-center justify-center gap-2 border border-rose-200 dark:border-rose-800">
                <i class="fas fa-sign-out-alt"></i>
                تسجيل الخروج
            </button>
        </div>
        
    </main>

    <div id="repNotificationsPanel" class="hidden fixed top-[84px] left-4 right-4 sm:left-auto sm:right-4 sm:w-[380px] z-[70]">
        <div class="rounded-[1.75rem] border border-slate-200/80 dark:border-slate-700 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between gap-2 px-4 py-3 border-b border-slate-100 dark:border-slate-800">
                <div>
                    <h2 class="text-sm font-black text-slate-900 dark:text-white">سجل الإشعارات</h2>
                    <p class="text-[10px] font-bold text-slate-500 dark:text-slate-300">آخر التحديثات تظهر هنا</p>
                </div>
                <div class="flex items-center gap-2">
                    <button id="markAllRepNotificationsReadBtn" class="text-[10px] font-black text-sky-800 bg-cyan-50 dark:bg-cyan-950/30 px-3 py-1.5 rounded-xl border border-cyan-100 dark:border-cyan-800">
                        تحديد الكل كمقروء
                    </button>
                    <button id="clearRepNotificationsBtn" class="text-[10px] font-black text-rose-500 bg-rose-50 dark:bg-rose-900/30 px-3 py-1.5 rounded-xl border border-rose-100 dark:border-rose-800">
                        مسح الكل
                    </button>
                </div>
            </div>
            <div id="repNotificationsContainer" class="max-h-[65vh] overflow-y-auto p-3.5 space-y-3.5"></div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script>
        const { createClient } = supabase;
        const supabaseClient = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        const REP_NOTIFICATIONS_KEY = 'rep_local_notifications';

        let user = JSON.parse(localStorage.getItem('user'));
        let repNotifications = JSON.parse(localStorage.getItem(REP_NOTIFICATIONS_KEY) || '[]');
        let isNotificationsPanelOpen = false;
        let isQuickActionsMenuOpen = false;
        if (!user || (user.role !== 'rep' && user.role !== 'مندوب فرعي')) {
            window.location.href = 'login.html';
        }

        function el(id) {
            return document.getElementById(id);
        }

        function setNotificationsButtonActive(active) {
            const notifBtn = el('nav-btn-notifications');
            if (!notifBtn) return;
            notifBtn.classList.toggle('text-sky-800', active);
            notifBtn.classList.toggle('dark:text-cyan-300', active);
            notifBtn.classList.toggle('text-slate-500', !active);
            notifBtn.classList.toggle('dark:text-slate-200', !active);
        }

        function updateRepNotifUI() {
            const badge = el('repUnreadBadge');
            if (!badge) return;
            const unreadCount = repNotifications.filter(n => !n.read).length;
            badge.innerText = unreadCount > 99 ? '99+' : String(unreadCount);
            badge.classList.toggle('hidden', unreadCount <= 0);
            if (isNotificationsPanelOpen) renderRepNotifications();
        }

        function renderRepNotifications() {
            const container = el('repNotificationsContainer');
            if (!container) return;

            if (repNotifications.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-14 rounded-[1.75rem] bg-slate-50 dark:bg-slate-800/70 border border-dashed border-slate-200 dark:border-slate-700">
                        <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-2xl flex items-center justify-center text-slate-400 mx-auto mb-4">
                            <i class="fas fa-bell-slash text-2xl"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 dark:text-white">لا توجد إشعارات</h3>
                        <p class="text-[10px] text-slate-400 dark:text-slate-300 mt-1">سيتم إخطارك بكل جديد هنا</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = repNotifications.map(n => `
                <div class="p-4 rounded-[1.5rem] flex items-start gap-3 border transition-all ${n.read ? 'bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800' : 'bg-gradient-to-l from-cyan-50 via-sky-50 to-white dark:from-cyan-950/40 dark:via-slate-900 dark:to-slate-900 border-cyan-200 dark:border-cyan-800 shadow-md shadow-cyan-100/60 dark:shadow-none ring-1 ring-cyan-100 dark:ring-cyan-900/40'}">
                    <div class="w-10 h-10 rounded-2xl flex items-center justify-center flex-shrink-0 ${n.read ? 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-300' : 'bg-cyan-100 dark:bg-cyan-950/40 text-cyan-700 dark:text-cyan-300 ring-4 ring-white dark:ring-slate-900'}">
                        <i class="fas fa-bell"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-start gap-3">
                            <h4 class="text-xs font-black text-slate-800 dark:text-white">${n.client || n.order_id || 'إشعار جديد'}</h4>
                            <span class="text-[9px] text-slate-400 dark:text-slate-300 font-bold">${n.time || ''}</span>
                        </div>
                        <p class="text-[11px] text-slate-600 dark:text-slate-300 mt-1">${n.type || 'تحديث جديد'}</p>
                    </div>
                </div>
            `).join('');
        }

        function markAllRepNotificationsAsRead() {
            repNotifications = repNotifications.map(item => ({ ...item, read: true }));
            localStorage.setItem(REP_NOTIFICATIONS_KEY, JSON.stringify(repNotifications));
            updateRepNotifUI();
        }

        function clearRepNotifications() {
            repNotifications = [];
            localStorage.setItem(REP_NOTIFICATIONS_KEY, JSON.stringify(repNotifications));
            updateRepNotifUI();
        }

        function openRepNotificationsPanel() {
            const panel = el('repNotificationsPanel');
            if (!panel) return;
            isNotificationsPanelOpen = true;
            panel.classList.remove('hidden');
            setNotificationsButtonActive(true);
            renderRepNotifications();
        }

        function closeRepNotificationsPanel() {
            const panel = el('repNotificationsPanel');
            if (!panel) return;
            isNotificationsPanelOpen = false;
            panel.classList.add('hidden');
            setNotificationsButtonActive(false);
        }

        function toggleRepNotificationsPanel() {
            if (isNotificationsPanelOpen) {
                closeRepNotificationsPanel();
                return;
            }
            markAllRepNotificationsAsRead();
            closeQuickActionsMenu();
            openRepNotificationsPanel();
        }

        function closeQuickActionsMenu() {
            const menu = el('quickActionsMenu');
            if (!menu) return;
            menu.classList.add('hidden');
            isQuickActionsMenuOpen = false;
        }

        function toggleQuickActionsMenu(forceState = null) {
            const menu = el('quickActionsMenu');
            if (!menu) return;
            const shouldOpen = typeof forceState === 'boolean' ? forceState : menu.classList.contains('hidden');
            if (shouldOpen) closeRepNotificationsPanel();
            menu.classList.toggle('hidden', !shouldOpen);
            isQuickActionsMenuOpen = shouldOpen;
        }

        function handleGpsButtonClick() {
            if (!navigator.geolocation) {
                Swal.fire('تنبيه', 'المتصفح لا يدعم خدمة الموقع على هذا الجهاز', 'warning');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                () => {
                    Swal.fire({
                        toast: true,
                        position: 'top-start',
                        icon: 'success',
                        title: 'تم تفعيل الوصول إلى الموقع',
                        showConfirmButton: false,
                        timer: 2000
                    });
                },
                () => {
                    Swal.fire('تنبيه', 'يرجى السماح بالوصول إلى الموقع من إعدادات المتصفح', 'warning');
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        startStoredUserSessionGuard(supabaseClient, {
            allowedRoles: ['rep', 'مندوب فرعي'],
            onValidUser: (latestUser) => {
                user = latestUser;
                const repNameEl = document.getElementById('repName');
                if (repNameEl) repNameEl.innerText = latestUser.full_name || latestUser.username || latestUser.phone;
                document.getElementById('profileName').innerText = latestUser.full_name || latestUser.username || 'مندوب';
                document.getElementById('profilePhone').innerText = latestUser.phone || 'غير مسجل';
            }
        });

        const repNameEl = document.getElementById('repName');
        if (repNameEl) repNameEl.innerText = user.full_name || user.username || user.phone;
        document.getElementById('profileName').innerText = user.full_name || user.username || 'مندوب';
        document.getElementById('profilePhone').innerText = user.phone || 'غير مسجل';

        async function changePassword(e) {
            e.preventDefault();
            
            const oldPass = document.getElementById('oldPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');

            if (newPass !== confirmPass) {
                Swal.fire('خطأ', 'كلمة المرور الجديدة غير متطابقة', 'error');
                return;
            }

            if(newPass.length < 4) {
                 Swal.fire('تنبيه', 'كلمة المرور يجب أن تكون 4 أحرف على الأقل', 'warning');
                 return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

            try {
                if (!(await verifyCurrentPasswordSecure(oldPass))) {
                    Swal.fire('خطأ', 'كلمة المرور الحالية غير صحيحة', 'error');
                    btn.disabled = false;
                    btn.innerHTML = 'حفظ كلمة المرور';
                    return;
                }

                // 2. Update to new password
                const hashedNewPass = await hashPassword(newPass);
                try {
                    await invokeUsersAuthAction('change_password', {
                        oldPassword: oldPass,
                        newPasswordHash: hashedNewPass
                    });
                    Swal.fire('تم بنجاح', 'تم تغيير كلمة المرور، يرجى تسجيل الدخول مجدداً', 'success').then(() => {
                        logout();
                    });
                } catch (updateError) {
                    Swal.fire('خطأ', updateError.message || 'فشل في تحديث كلمة المرور', 'error');
                }

            } catch (err) {
                console.error(err);
                Swal.fire('خطأ', 'حدث خطأ غير متوقع', 'error');
            }

            btn.disabled = false;
            btn.innerHTML = 'حفظ كلمة المرور';
        }

        function logout() {
            clearStoredUserSession();
        }

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            const isDark = body.classList.toggle('dark');
            
            icon.className = isDark ? 'fas fa-sun text-xl' : 'fas fa-moon text-xl';
            localStorage.setItem('rep-theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('rep-theme') === 'dark') {
            document.body.classList.add('dark');
            document.getElementById('themeIcon').className = 'fas fa-sun text-xl';
        }

        el('quickActionsToggleBtn')?.addEventListener('click', (event) => {
            event.stopPropagation();
            toggleQuickActionsMenu();
        });
        el('nav-btn-notifications')?.addEventListener('click', (event) => {
            event.stopPropagation();
            toggleRepNotificationsPanel();
        });
        el('themeToggleBtn')?.addEventListener('click', () => {
            toggleTheme();
            closeQuickActionsMenu();
        });
        el('gpsToggleBtn')?.addEventListener('click', () => {
            handleGpsButtonClick();
            closeQuickActionsMenu();
        });
        el('logoutMenuBtn')?.addEventListener('click', () => {
            closeQuickActionsMenu();
            logout();
        });
        el('markAllRepNotificationsReadBtn')?.addEventListener('click', markAllRepNotificationsAsRead);
        el('clearRepNotificationsBtn')?.addEventListener('click', clearRepNotifications);
        document.addEventListener('click', (event) => {
            const quickActionsMenu = el('quickActionsMenu');
            const quickActionsBtn = el('quickActionsToggleBtn');
            if (isQuickActionsMenuOpen && quickActionsMenu && quickActionsBtn && !quickActionsMenu.contains(event.target) && !quickActionsBtn.contains(event.target)) {
                closeQuickActionsMenu();
            }
            const notifPanel = el('repNotificationsPanel');
            const notifBtn = el('nav-btn-notifications');
            if (isNotificationsPanelOpen && notifPanel && notifBtn && !notifPanel.contains(event.target) && !notifBtn.contains(event.target)) {
                closeRepNotificationsPanel();
            }
        });
        updateRepNotifUI();
    </script>
</body>
</html>
