<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://evrqxgnqwngokukqerps.supabase.co https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), browsing-topics=()">
    <title>الحساب | نظام الشحن الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .account-hero {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background:
                radial-gradient(circle at top right, rgba(99, 102, 241, 0.22), transparent 32%),
                radial-gradient(circle at bottom left, rgba(14, 165, 233, 0.16), transparent 28%),
                linear-gradient(145deg, rgba(255,255,255,0.96), rgba(248,250,252,0.9));
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.10);
        }

        .dark .account-hero {
            border-color: rgba(148, 163, 184, 0.14);
            background:
                radial-gradient(circle at top right, rgba(99, 102, 241, 0.28), transparent 32%),
                radial-gradient(circle at bottom left, rgba(56, 189, 248, 0.16), transparent 28%),
                linear-gradient(145deg, rgba(15,23,42,0.92), rgba(2,6,23,0.92));
            box-shadow: 0 24px 70px rgba(2, 6, 23, 0.48);
        }

        .account-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 0.9rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(99, 102, 241, 0.12);
            color: #4338ca;
            font-size: 0.72rem;
            font-weight: 800;
        }

        .dark .account-chip {
            background: rgba(15, 23, 42, 0.7);
            border-color: rgba(99, 102, 241, 0.24);
            color: #c7d2fe;
        }

        .hero-icon {
            width: 4rem;
            height: 4rem;
            border-radius: 1.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: linear-gradient(135deg, #4f46e5, #0ea5e9);
            box-shadow: 0 18px 40px rgba(79, 70, 229, 0.32);
        }

        .quick-action {
            width: 3rem;
            height: 3rem;
            border-radius: 1rem;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(255,255,255,0.7);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            transition: 0.25s ease;
        }

        .quick-action:hover {
            transform: translateY(-2px);
            color: #4f46e5;
            box-shadow: 0 14px 28px rgba(99, 102, 241, 0.18);
        }

        .dark .quick-action {
            background: rgba(15, 23, 42, 0.78);
            border-color: rgba(148, 163, 184, 0.14);
            color: #cbd5e1;
        }

        .account-panel {
            border: 1px solid rgba(148, 163, 184, 0.14);
            background: rgba(255,255,255,0.76);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(18px);
        }

        .dark .account-panel {
            border-color: rgba(148, 163, 184, 0.10);
            background: rgba(15,23,42,0.78);
            box-shadow: 0 24px 64px rgba(2, 6, 23, 0.42);
        }

        .info-card {
            border-radius: 1.35rem;
            border: 1px solid rgba(148, 163, 184, 0.12);
            background: linear-gradient(180deg, rgba(255,255,255,0.88), rgba(248,250,252,0.78));
            padding: 1rem 1.1rem;
        }

        .dark .info-card {
            border-color: rgba(148, 163, 184, 0.10);
            background: linear-gradient(180deg, rgba(30,41,59,0.88), rgba(15,23,42,0.84));
        }

        .account-form-grid {
            display: grid;
            gap: 1rem;
        }

        .account-input {
            border-radius: 1.1rem;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(255,255,255,0.85);
            transition: 0.25s ease;
        }

        .account-input:focus {
            border-color: rgba(99, 102, 241, 0.35);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.10);
        }

        .dark .account-input {
            background: rgba(15,23,42,0.82);
            border-color: rgba(148, 163, 184, 0.14);
        }

        .account-submit {
            min-height: 3.5rem;
            border-radius: 1.2rem;
            background: linear-gradient(135deg, #4f46e5, #0ea5e9);
            box-shadow: 0 18px 38px rgba(79, 70, 229, 0.24);
        }

        .bottom-dock {
            border: 1px solid rgba(148, 163, 184, 0.16);
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(20px);
            box-shadow: 0 24px 50px rgba(15, 23, 42, 0.14);
        }

        .dark .bottom-dock {
            border-color: rgba(148, 163, 184, 0.12);
            background: rgba(15,23,42,0.84);
            box-shadow: 0 24px 60px rgba(2, 6, 23, 0.48);
        }

        /* Header Styles */
        .hero-shell {
            position: relative;
            overflow: visible;
        }

        .hero-shell::before {
            content: "";
            position: absolute;
            top: -70px;
            right: -30px;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(15, 76, 129, 0.2), transparent 68%);
            pointer-events: none;
        }

        .hero-shell::after {
            content: "";
            position: absolute;
            bottom: -80px;
            left: -40px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.14), transparent 70%);
            pointer-events: none;
        }

        .header-chip {
            background: rgba(255, 255, 255, 0.74);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.86);
        }

        .dark .header-chip {
            background: rgba(15, 23, 42, 0.74);
            border-color: rgba(148, 163, 184, 0.14);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-indigo-50/50 dark:bg-slate-950 min-h-screen transition-colors duration-300">

    <!-- Header -->
    <header class="hero-shell bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl sticky top-0 z-50 px-4 py-4 mb-4 border-b border-slate-200/80 dark:border-slate-800 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
            <div class="relative z-10 flex w-[98px] shrink-0 items-center justify-start gap-2">
                <button onclick="window.location.href='rep-dashboard.html'" 
                    class="relative h-11 w-11 shrink-0 flex items-center justify-center rounded-2xl header-chip text-slate-500 dark:text-slate-200 hover:text-sky-800 dark:hover:text-cyan-400 transition-colors"
                    title="العودة" aria-label="العودة">
                    <i class="fas fa-arrow-right text-lg"></i>
                </button>
            </div>
            <div class="flex min-w-0 flex-1 items-center justify-center">
                <h1 class="text-base font-black text-slate-900 dark:text-white">الحساب</h1>
            </div>
            <div class="relative z-10 flex shrink-0 items-center justify-end gap-2">
                <button onclick="window.location.href='rep-dashboard.html#favorites'"
                    class="relative h-11 w-11 shrink-0 flex items-center justify-center rounded-2xl header-chip text-slate-500 dark:text-slate-200 hover:text-rose-600 dark:hover:text-rose-400 transition-colors"
                    title="المفضلة" aria-label="المفضلة">
                    <i class="fas fa-heart text-lg"></i>
                </button>
                <button onclick="toggleTheme()" 
                    class="relative h-11 w-11 shrink-0 flex items-center justify-center rounded-2xl header-chip text-slate-500 dark:text-slate-200 hover:text-sky-800 dark:hover:text-cyan-400 transition-colors"
                    title="الوضع الليلي" aria-label="الوضع الليلي">
                    <i id="themeIcon" class="fas fa-moon text-lg"></i>
                </button>
                <button onclick="logout()" 
                    class="relative h-11 w-11 shrink-0 flex items-center justify-center rounded-2xl header-chip text-slate-500 dark:text-slate-200 hover:text-rose-600 dark:hover:text-rose-400 transition-colors"
                    title="تسجيل الخروج" aria-label="تسجيل الخروج">
                    <i class="fas fa-power-off text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Account Hero Section -->
    <header class="px-4 pt-2 pb-2">
        <div class="max-w-4xl mx-auto">
            <div class="account-hero rounded-[2rem] p-5 md:p-7">
                <div class="flex items-start justify-between gap-4 flex-wrap">
                    <div class="space-y-3">
                        <span class="account-chip">
                            <i class="fas fa-shield-halved"></i>
                            إدارة آمنة للحساب
                        </span>
                        <div class="flex items-center gap-4">
                            <div class="hero-icon">
                                <i class="fas fa-user-cog text-2xl"></i>
                            </div>
                            <div>
                                <h1 class="text-2xl md:text-3xl font-black text-slate-900 dark:text-white">إعدادات الحساب</h1>
                                <p class="text-sm md:text-base font-bold text-slate-600 dark:text-slate-300 mt-1">
                                    تحديث بياناتك وكلمة المرور من مكان واضح وسلس.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-5 grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div class="info-card">
                        <p class="text-[11px] font-black text-slate-500 dark:text-slate-400 mb-2">اسم المندوب الحالي</p>
                        <p class="text-base md:text-lg font-black text-slate-900 dark:text-white" id="repName">مندوب توصيل</p>
                    </div>
                    <div class="info-card">
                        <p class="text-[11px] font-black text-slate-500 dark:text-slate-400 mb-2">حالة الأمان</p>
                        <p class="text-sm font-extrabold text-emerald-600 dark:text-emerald-400 flex items-center gap-2">
                            <i class="fas fa-circle-check"></i>
                            الجلسة نشطة ويمكنك تعديل كلمة المرور بأمان
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pb-28 space-y-6">
        
        <!-- Profile Info -->
        <div class="account-panel p-6 rounded-[2rem] space-y-4">
            <h2 class="font-bold text-slate-800 dark:text-white flex items-center gap-2 mb-4">
                <i class="fas fa-id-card text-indigo-600"></i>
                البيانات الشخصية
            </h2>
            
            <div class="info-card">
                <p class="text-xs text-slate-500 mb-1 font-bold">الاسم</p>
                <p class="text-sm font-black text-slate-800 dark:text-white" id="profileName">---</p>
            </div>
            
            <div class="info-card">
                <p class="text-xs text-slate-500 mb-1 font-bold">رقم الهاتف</p>
                <p class="text-sm font-black text-slate-800 dark:text-white" id="profilePhone" dir="ltr" style="text-align: right;">---</p>
            </div>
        </div>
        
        <!-- Change Password -->
        <div class="account-panel p-6 rounded-[2rem] space-y-4">
            <h2 class="font-bold text-slate-800 dark:text-white flex items-center gap-2 mb-4">
                <i class="fas fa-lock text-indigo-600"></i>
                تغيير كلمة المرور
            </h2>
            
            <form id="changePasswordForm" class="account-form-grid" onsubmit="changePassword(event)">
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">كلمة المرور الحالية</label>
                    <div class="relative">
                        <i class="fas fa-key absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        <input type="password" id="oldPassword" required class="input-field account-input pr-12 text-sm font-semibold shadow-sm w-full" placeholder="أدخل كلمة المرور الحالية">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">كلمة المرور الجديدة</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        <input type="password" id="newPassword" required class="input-field account-input pr-12 text-sm font-semibold shadow-sm w-full" placeholder="أدخل كلمة المرور الجديدة">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">تأكيد كلمة المرور الجديدة</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        <input type="password" id="confirmPassword" required class="input-field account-input pr-12 text-sm font-semibold shadow-sm w-full" placeholder="تأكيد كلمة المرور الجديدة">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" id="submitBtn" class="w-full btn-primary account-submit py-3">
                        حفظ كلمة المرور
                    </button>
                </div>
            </form>
        </div>

        <div class="pt-4">
            <button onclick="logout()" class="w-full bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 hover:bg-rose-100 transition-colors font-bold py-4 rounded-2xl shadow-sm flex items-center justify-center gap-2 border border-rose-200 dark:border-rose-800">
                <i class="fas fa-sign-out-alt"></i>
                تسجيل الخروج
            </button>
        </div>
        
    </main>

    <!-- Navigation Bottom (Mobile Only) -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[95%] max-w-lg bottom-dock rounded-full px-4 py-3 flex items-center justify-around z-50">
        <a href="rep-dashboard.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-600 transition-colors">
            <i class="fas fa-box text-xl"></i>
            <span class="text-[9px] font-black">شحناتي</span>
        </a>

        <a href="rep-dashboard.html#favorites" class="flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-600 transition-colors relative">
            <i class="fas fa-heart text-xl"></i>
            <span class="text-[9px] font-black">المفضلة</span>
        </a>

        <a href="wallet.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-600 transition-colors relative">
            <i class="fas fa-wallet text-xl"></i>
            <span class="text-[9px] font-black">المحفظة</span>
        </a>

        <button class="flex flex-col items-center gap-1 text-indigo-600 transition-colors">
            <i class="fas fa-user text-xl"></i>
            <span class="text-[9px] font-black">الحساب</span>
        </button>
    </nav>

    <script src="assets/js/config.js"></script>
    <script>
        const { createClient } = supabase;
        const supabaseClient = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

        let user = JSON.parse(localStorage.getItem('user'));
        if (!user || (user.role !== 'rep' && user.role !== 'مندوب فرعي')) {
            window.location.href = 'login.html';
        }
        startStoredUserSessionGuard(supabaseClient, {
            allowedRoles: ['rep', 'مندوب فرعي'],
            onValidUser: (latestUser) => {
                user = latestUser;
                document.getElementById('repName').innerText = latestUser.full_name || latestUser.username || latestUser.phone;
                document.getElementById('profileName').innerText = latestUser.full_name || latestUser.username || 'مندوب';
                document.getElementById('profilePhone').innerText = latestUser.phone || 'غير مسجل';
            }
        });

        document.getElementById('repName').innerText = user.full_name || user.username || user.phone;
        document.getElementById('profileName').innerText = user.full_name || user.username || 'مندوب';
        document.getElementById('profilePhone').innerText = user.phone || 'غير مسجل';

        async function changePassword(e) {
            e.preventDefault();
            
            const oldPass = document.getElementById('oldPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');

            if (newPass !== confirmPass) {
                Swal.fire('خطأ', 'كلمة المرور الجديدة غير متطابقة', 'error');
                return;
            }

            if(newPass.length < 4) {
                 Swal.fire('تنبيه', 'كلمة المرور يجب أن تكون 4 أحرف على الأقل', 'warning');
                 return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

            try {
                if (!(await verifyCurrentPasswordSecure(oldPass))) {
                    Swal.fire('خطأ', 'كلمة المرور الحالية غير صحيحة', 'error');
                    btn.disabled = false;
                    btn.innerHTML = 'حفظ كلمة المرور';
                    return;
                }

                // 2. Update to new password
                const hashedNewPass = await hashPassword(newPass);
                try {
                    await invokeUsersAuthAction('change_password', {
                        oldPassword: oldPass,
                        newPasswordHash: hashedNewPass
                    });
                    Swal.fire('تم بنجاح', 'تم تغيير كلمة المرور، يرجى تسجيل الدخول مجدداً', 'success').then(() => {
                        logout();
                    });
                } catch (updateError) {
                    Swal.fire('خطأ', updateError.message || 'فشل في تحديث كلمة المرور', 'error');
                }

            } catch (err) {
                console.error(err);
                Swal.fire('خطأ', 'حدث خطأ غير متوقع', 'error');
            }

            btn.disabled = false;
            btn.innerHTML = 'حفظ كلمة المرور';
        }

        function logout() {
            clearStoredUserSession();
        }

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            const isDark = body.classList.toggle('dark');
            
            icon.className = isDark ? 'fas fa-sun text-xl' : 'fas fa-moon text-xl';
            localStorage.setItem('rep-theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('rep-theme') === 'dark') {
            document.body.classList.add('dark');
            document.getElementById('themeIcon').className = 'fas fa-sun text-xl';
        }
    </script>
</body>
</html>
