<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://evrqxgnqwngokukqerps.supabase.co https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), browsing-topics=()">
    <title>المحفظة | نظام الشحن الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/pages/wallet.css">
</head>
<body class="bg-indigo-50/50 dark:bg-slate-950 min-h-screen transition-colors duration-300">

    <!-- Header -->
    <header class="hero-shell bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl sticky top-0 z-50 px-4 py-4 mb-4 border-b border-slate-200/80 dark:border-slate-800 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
            <div class="relative z-10 flex w-[98px] shrink-0 items-center justify-start gap-2">
                <button onclick="window.location.href='rep-dashboard.html'" 
                    class="relative h-11 w-11 shrink-0 flex items-center justify-center rounded-2xl header-chip text-slate-500 dark:text-slate-200 hover:text-sky-800 dark:hover:text-cyan-400 transition-colors"
                    title="العودة" aria-label="العودة">
                    <i class="fas fa-arrow-right text-lg"></i>
                </button>
            </div>
            <div class="flex min-w-0 flex-1 items-center justify-center">
                <h1 class="text-base font-black text-slate-900 dark:text-white">المحفظة</h1>
            </div>
            <div class="relative z-10 flex shrink-0 items-center justify-end gap-2">
                <button onclick="window.location.href='rep-dashboard.html#favorites'"
                    class="relative h-11 w-11 shrink-0 flex items-center justify-center rounded-2xl header-chip text-slate-500 dark:text-slate-200 hover:text-rose-600 dark:hover:text-rose-400 transition-colors"
                    title="المفضلة" aria-label="المفضلة">
                    <i class="fas fa-heart text-lg"></i>
                </button>
                <button onclick="toggleTheme()" 
                    class="relative h-11 w-11 shrink-0 flex items-center justify-center rounded-2xl header-chip text-slate-500 dark:text-slate-200 hover:text-sky-800 dark:hover:text-cyan-400 transition-colors"
                    title="الوضع الليلي" aria-label="الوضع الليلي">
                    <i id="themeIcon" class="fas fa-moon text-lg"></i>
                </button>
                <button onclick="logout()" 
                    class="relative h-11 w-11 shrink-0 flex items-center justify-center rounded-2xl header-chip text-slate-500 dark:text-slate-200 hover:text-rose-600 dark:hover:text-rose-400 transition-colors"
                    title="تسجيل الخروج" aria-label="تسجيل الخروج">
                    <i class="fas fa-power-off text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pb-28">
        
        <div class="wallet-panel p-6 rounded-[2rem] space-y-6">
            <div>
                <label class="block text-sm font-bold text-slate-600 dark:text-slate-400 mb-2">تصفية حسب اليومية</label>
                <div class="relative">
                    <button id="filterDateBtn" onclick="document.getElementById('filterDateMenu').classList.toggle('hidden');" class="wallet-filter-btn w-full px-4 py-3 text-sm font-bold text-slate-600 dark:text-white outline-none text-center flex items-center justify-between transition-all duration-300">
                        <span id="filterDateLabel" class="truncate">اختر اليومية</span>
                        <i class="fas fa-chevron-down text-xs opacity-60"></i>
                    </button>
                    <div id="filterDateMenu" class="hidden absolute top-full right-0 mt-2 w-full wallet-panel rounded-2xl max-h-48 overflow-y-auto z-[60] p-2 flex flex-col gap-1 text-right text-xs"></div>
                </div>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <div class="wallet-stat bg-indigo-50 dark:bg-indigo-900/30 border border-indigo-100 dark:border-indigo-800/50 text-center">
                    <p class="text-xs font-black text-indigo-600 dark:text-indigo-400 mb-2">إجمالي الشحنات</p>
                    <h4 id="walletTotalCount" class="text-3xl font-black text-slate-800 dark:text-white">0</h4>
                </div>
                <div class="wallet-stat bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-100 dark:border-emerald-800/50 text-center">
                    <p class="text-xs font-black text-emerald-600 dark:text-emerald-400 mb-2">تم</p>
                    <h4 id="walletDeliveredCount" class="text-3xl font-black text-slate-800 dark:text-white">0</h4>
                    <p id="walletDeliveredAmount" class="mt-1 text-xs font-bold text-slate-600 dark:text-slate-300">0 ج.م</p>
                </div>
                <div class="wallet-stat bg-cyan-50 dark:bg-cyan-900/30 border border-cyan-100 dark:border-cyan-800/50 text-center">
                    <p class="text-xs font-black text-cyan-600 dark:text-cyan-400 mb-2">تعديل سعر</p>
                    <h4 id="walletPriceEditedCount" class="text-3xl font-black text-slate-800 dark:text-white">0</h4>
                    <p id="walletPriceEditedAmount" class="mt-1 text-xs font-bold text-slate-600 dark:text-slate-300">0 ج.م</p>
                </div>
                <div class="wallet-stat bg-rose-50 dark:bg-rose-900/30 border border-rose-100 dark:border-rose-800/50 text-center">
                    <p class="text-xs font-black text-rose-600 dark:text-rose-400 mb-2">رفض</p>
                    <h4 id="walletRejectedCount" class="text-3xl font-black text-slate-800 dark:text-white">0</h4>
                </div>
                <div class="wallet-stat bg-sky-50 dark:bg-sky-900/30 border border-sky-100 dark:border-sky-800/50 text-center">
                    <p class="text-xs font-black text-sky-600 dark:text-sky-400 mb-2">شحن</p>
                    <h4 id="walletShippingCount" class="text-3xl font-black text-slate-800 dark:text-white">0</h4>
                    <p id="walletShippingAmount" class="mt-1 text-xs font-bold text-slate-600 dark:text-slate-300">0 ج.م</p>
                </div>
                <div class="wallet-stat bg-amber-50 dark:bg-amber-900/30 border border-amber-100 dark:border-amber-800/50 text-center">
                    <p class="text-xs font-black text-amber-600 dark:text-amber-400 mb-2">قيد التوصيل</p>
                    <h4 id="walletInTransitCount" class="text-3xl font-black text-slate-800 dark:text-white">0</h4>
                </div>
                <div class="wallet-stat bg-violet-50 dark:bg-violet-900/30 border border-violet-100 dark:border-violet-800/50 text-center">
                    <p class="text-xs font-black text-violet-600 dark:text-violet-400 mb-2">مؤجل</p>
                    <h4 id="walletDelayedCount" class="text-3xl font-black text-slate-800 dark:text-white">0</h4>
                </div>
                <div class="wallet-stat bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-100 dark:border-emerald-800/50 text-center">
                    <p class="text-xs font-black text-emerald-600 dark:text-emerald-400 mb-2">إجمالي التحصيل</p>
                    <h4 id="walletTotalMoney" class="text-2xl font-black text-slate-800 dark:text-white truncate">0 <span class="text-xs">ج.م</span></h4>
                </div>
                <div class="wallet-stat bg-teal-50 dark:bg-teal-900/30 border border-teal-100 dark:border-teal-800/50 text-center">
                    <p class="text-xs font-black text-teal-600 dark:text-teal-400 mb-2">عمولة المندوب</p>
                    <h4 id="walletCommissionTotal" class="text-2xl font-black text-slate-800 dark:text-white truncate">0 <span class="text-xs">ج.م</span></h4>
                </div>
            </div>

        </div>
    </main>

    <!-- Navigation Bottom (Mobile Only) -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/shared/session.js"></script>
    <script src="assets/js/shared/theme.js"></script>
    <script src="assets/js/shared/shipments.js"></script>
    <script src="assets/js/pages/wallet.js"></script>
</body>
</html>
