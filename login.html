    <style>
        .login-stage {
            position: relative;
            isolation: isolate;
            overflow: hidden;
        }

        .login-stage::before,
        .login-stage::after {
            content: '';
            position: absolute;
            inset: auto;
            border-radius: 999px;
            filter: blur(18px);
            z-index: -1;
        }

        .login-stage::before {
            width: 220px;
            height: 220px;
            top: -70px;
            right: -60px;
            background: rgba(234, 88, 12, 0.16);
        }

        .login-stage::after {
            width: 190px;
            height: 190px;
            bottom: -80px;
            left: -55px;
            background: rgba(14, 165, 233, 0.12);
        }

        .theme-fab {
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(255,255,255,0.85);
            box-shadow: 0 18px 36px rgba(15, 23, 42, 0.12);
            backdrop-filter: blur(14px);
        }

        .dark .theme-fab {
            background: rgba(15,23,42,0.84);
            border-color: rgba(148, 163, 184, 0.12);
            box-shadow: 0 18px 42px rgba(2, 6, 23, 0.42);
        }

        .auth-shell {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.16);
            background:
                radial-gradient(circle at top right, rgba(234, 88, 12, 0.18), transparent 30%),
                radial-gradient(circle at bottom left, rgba(56, 189, 248, 0.14), transparent 28%),
                linear-gradient(155deg, rgba(255,255,255,0.96), rgba(248,250,252,0.92));
            box-shadow: 0 32px 68px rgba(15, 23, 42, 0.12);
        }

        .dark .auth-shell {
            border-color: rgba(148, 163, 184, 0.12);
            background:
                radial-gradient(circle at top right, rgba(234, 88, 12, 0.22), transparent 30%),
                radial-gradient(circle at bottom left, rgba(56, 189, 248, 0.12), transparent 28%),
                linear-gradient(155deg, rgba(15,23,42,0.92), rgba(2,6,23,0.94));
            box-shadow: 0 32px 80px rgba(2, 6, 23, 0.46);
        }

        .brand-orb {
            width: 5.5rem;
            height: 5.5rem;
            border-radius: 1.8rem;
            background: linear-gradient(135deg, #c2410c, #0ea5e9);
            box-shadow: 0 18px 44px rgba(194, 65, 12, 0.32);
        }

        .soft-auth-input {
            min-height: 3.45rem;
            border-radius: 1rem;
            border: 1px solid rgba(148, 163, 184, 0.18) !important;
            background: rgba(255,255,255,0.88) !important;
            transition: 0.25s ease;
        }

        .soft-auth-input:focus {
            border-color: rgba(234, 88, 12, 0.4) !important;
            box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.10);
        }

        .dark .soft-auth-input {
            background: rgba(15,23,42,0.82) !important;
            border-color: rgba(148, 163, 184, 0.14) !important;
        }

        .auth-submit {
            min-height: 3.65rem;
            border-radius: 1.1rem;
            box-shadow: 0 18px 36px rgba(194, 65, 12, 0.22);
        }

        .auth-modal {
            border: 1px solid rgba(148, 163, 184, 0.16);
            background:
                radial-gradient(circle at top right, rgba(234, 88, 12, 0.12), transparent 30%),
                linear-gradient(160deg, rgba(255,255,255,0.98), rgba(248,250,252,0.94));
            box-shadow: 0 36px 70px rgba(15, 23, 42, 0.16);
        }

        .dark .auth-modal {
            border-color: rgba(148, 163, 184, 0.12);
            background:
                radial-gradient(circle at top right, rgba(234, 88, 12, 0.16), transparent 30%),
                linear-gradient(160deg, rgba(15,23,42,0.96), rgba(2,6,23,0.96));
            box-shadow: 0 36px 80px rgba(2, 6, 23, 0.52);
        }
        .login-brand { font-weight: 800; color: #0f172a; }
        .dark .login-brand { color: #f8fafc; }
        .login-sub { color: #475569; font-weight: 600; }
        .dark .login-sub { color: #cbd5e1; }
        .swal2-show,.swal2-hide{animation:none!important}.swal2-popup{transition:none!important}body.no-transitions,body.no-transitions*{transition:none!important}
        .dark .swal2-popup { background:#1e293b!important; color:#e2e8f0!important; }
        .dark .swal2-title { color:#f1f5f9!important; }
        .dark .swal2-html-container { color:#cbd5e1!important; }
        .dark .swal2-icon-success [class^=swal2-success-line] { background:#22c55e!important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <div class="absolute top-4 left-4 z-50">
        <button onclick="toggleTheme()" class="theme-fab p-3 rounded-full text-slate-500 dark:text-slate-300 hover:text-indigo-600 transition-colors">
            <i id="themeIcon" class="fas fa-moon text-xl"></i>
        </button>
    </div>

    <div class="max-w-md w-full animate-fade-in login-stage">
        <div class="auth-shell p-6 sm:p-8 rounded-[2rem] relative mx-2 sm:mx-0">
            <div class="absolute inset-x-8 top-0 h-px bg-gradient-to-r from-transparent via-white/70 to-transparent dark:via-white/10"></div>

            <div class="text-center mb-8 relative">
                <div class="brand-orb flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                    </svg>
                </div>
                <h1 id="loginBrand" class="text-3xl login-brand mb-2">لايت شبينج</h1>
            </div>

            <form id="loginForm" class="space-y-6 relative">
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 mr-1">رقم الموبايل</label>
                    <input type="text" id="phone" name="phone" required class="input-field soft-auth-input text-slate-900 dark:text-white w-full py-4 px-4 text-base" placeholder="01xxxxxxxxx">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 mr-1">كلمة المرور</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" required class="input-field soft-auth-input text-slate-900 dark:text-white w-full py-4 px-4 text-base pl-12" placeholder="••••••••">
                        <button type="button" onclick="toggleLoginPassword('password', this)" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" style="background:none;border:none;padding:0;cursor:pointer;"><i class="fas fa-eye"></i></button>
                    </div>
                </div>

                <div class="flex items-center justify-between px-1">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded text-indigo-600 border-slate-300 focus:ring-indigo-500">
                        <span class="text-sm font-semibold text-slate-600 group-hover:text-slate-800 transition-colors">تذكرني</span>
                    </label>
                    <a href="#" class="text-sm font-bold text-indigo-600 hover:text-indigo-800 transition-colors">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" id="loginBtn" class="w-full py-4 auth-submit btn-primary flex items-center justify-center gap-2 text-xl font-black mt-2 mb-4 active:scale-95 transition-transform">
                    <span>تسجيل الدخول</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                    </svg>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <p class="text-slate-500 font-semibold">ليس لديك حساب؟ <a href="#" id="openRepSignup" class="text-indigo-600 font-bold hover:underline">انشئ حساب</a></p>
            </div>
        </div>

        <p class="text-center mt-8 text-slate-400 font-bold text-sm">© 2026 نظام الشحن المتطور - جميع الحقوق محفوظة</p>
    </div>

    <div id="repSignupModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 backdrop-blur-sm p-4">
        <div class="w-full max-w-lg auth-modal rounded-[2rem] p-6 md:p-8 relative">
            <button type="button" id="closeRepSignup" class="absolute top-4 left-4 w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 dark:hover:text-white transition-colors">
                <i class="fas fa-times"></i>
            </button>

            <div class="mb-6">
                <h2 class="text-2xl font-extrabold text-slate-800 dark:text-white mb-2">إنشاء حساب مندوب</h2>
            </div>

            <form id="repSignupForm" class="space-y-4">
                <div>
                    <label for="signupName" class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 mr-1">اسم المندوب</label>
                    <input type="text" id="signupName" required class="input-field soft-auth-input text-slate-900 dark:text-white w-full py-4 px-4 text-base" placeholder="اكتب الاسم">
                </div>
                <div>
                    <label for="signupPhone" class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 mr-1">رقم الموبايل</label>
                    <input type="text" id="signupPhone" required class="input-field soft-auth-input text-slate-900 dark:text-white w-full py-4 px-4 text-base" placeholder="01xxxxxxxxx">
                </div>
                <div>
                    <label for="signupEmail" class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 mr-1">البريد الإلكتروني</label>
                    <input type="email" id="signupEmail" required class="input-field soft-auth-input text-slate-900 dark:text-white w-full py-4 px-4 text-base" placeholder="name@example.com">
                </div>
                <div>
                    <label for="signupPassword" class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 mr-1">كلمة المرور</label>
                    <div class="relative">
                        <input type="password" id="signupPassword" required class="input-field soft-auth-input text-slate-900 dark:text-white w-full py-4 px-4 text-base pl-12" placeholder="6 أحرف على الأقل">
                        <button type="button" onclick="toggleLoginPassword('signupPassword', this)" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" style="background:none;border:none;padding:0;cursor:pointer;"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <div>
                    <label for="signupPasswordConfirm" class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 mr-1">تأكيد كلمة المرور</label>
                    <div class="relative">
                        <input type="password" id="signupPasswordConfirm" required class="input-field soft-auth-input text-slate-900 dark:text-white w-full py-4 px-4 text-base pl-12" placeholder="أعد كتابة كلمة المرور">
                        <button type="button" onclick="toggleLoginPassword('signupPasswordConfirm', this)" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" style="background:none;border:none;padding:0;cursor:pointer;"><i class="fas fa-eye"></i></button>
                    </div>
                </div>

                <button type="submit" id="signupBtn" class="w-full py-4 auth-submit btn-primary flex items-center justify-center gap-2 text-xl font-black mt-4 active:scale-95 transition-transform">
                    <span>إنشاء الحساب</span>
                    <i class="fas fa-user-plus"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="assets/js/shipment-config.js?v=00FF6D6992"></script>
    <script>
        const BUILD = '5'; if (!window.location.href.includes('_t=')) { localStorage.setItem('rep-version', BUILD); window.location.href = window.location.href.split('?')[0] + '?_t=' + BUILD; }
        const { createClient } = supabase;
        const supabaseClient = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const rememberMeCheckbox = document.getElementById('rememberMe');

        // اسم النظام: قراءة override المطوّر (آمن عبر textContent + حد أقصى + fallback)
        (function applySystemBrand() {
            var brand = document.getElementById('loginBrand');
            if (!brand) return;
            var custom = '';
            try {
                var raw = localStorage.getItem('dev_system_name');
                if (raw) custom = _dec(raw);
            } catch (e) {}
            if (typeof custom !== 'string' || !custom.trim()) return; // fallback للاسم الأصلي
            custom = custom.replace(/[<>&"']/g, '').trim().slice(0, 40);
            if (!custom) return;
            brand.textContent = custom; // textContent يمنع أي حقن HTML/سكريبت
        })();

        window.addEventListener('DOMContentLoaded', () => {
            const savedPhone = localStorage.getItem('savedPhone');
            const savedPassword = localStorage.getItem('savedPassword');
            if (savedPhone && savedPassword) {
                document.getElementById('phone').value = savedPhone;
                document.getElementById('password').value = savedPassword;
                if (rememberMeCheckbox) rememberMeCheckbox.checked = true;
            }
        });
        const repSignupModal = document.getElementById('repSignupModal');
        const repSignupForm = document.getElementById('repSignupForm');
        const signupBtn = document.getElementById('signupBtn');
        const openRepSignupBtn = document.getElementById('openRepSignup');
        const closeRepSignupBtn = document.getElementById('closeRepSignup');

        function toggleTheme() {
            document.body.classList.add('no-transitions');
            const isDark = document.body.classList.toggle('dark');
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = isDark ? 'fas fa-sun text-xl' : 'fas fa-moon text-xl';
            localStorage.setItem('shipment-theme', isDark ? 'dark' : 'light');
        document.documentElement.classList.toggle('light-forced', !isDark);
            requestAnimationFrame(() => document.body.classList.remove('no-transitions'));
        }

        (function initTheme() {
            const saved = localStorage.getItem('shipment-theme');
            const preferDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const shouldBeDark = saved ? saved === 'dark' : preferDark;
            if (shouldBeDark) {
                document.body.classList.add('dark');
                const icon = document.getElementById('themeIcon');
                if (icon) icon.className = 'fas fa-sun text-xl';
            }
        })();

        function toggleRepSignupModal(show) {
            repSignupModal.classList.toggle('hidden', !show);
            repSignupModal.classList.toggle('flex', show);
            document.body.classList.toggle('overflow-hidden', show);
        }

        openRepSignupBtn.addEventListener('click', (e) => {
            e.preventDefault();
            repSignupForm.reset();
            toggleRepSignupModal(true);
        });

        closeRepSignupBtn.addEventListener('click', () => toggleRepSignupModal(false));

        repSignupModal.addEventListener('click', (e) => {
            if (e.target === repSignupModal) toggleRepSignupModal(false);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && repSignupModal.classList.contains('flex')) {
                toggleRepSignupModal(false);
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = 'جاري التحقق...';

            // Dev login check
            try {
                if (phone === DEV_PHONE && password === DEV_PASS) {
                    localStorage.setItem('dev_logged_in', 'true');
                    saveUserSession({ id: 0, username: 'Developer', phone: DEV_PHONE, role: 'developer' }, 'dev_token');
                    Swal.fire({ icon: 'success', title: 'مرحباً أيها المطور', timer: 1000, showConfirmButton: false }).then(function() {
                        window.location.href = 'dev-settings.html';
                    });
                    return;
                }
            } catch(devErr) {}

            try {
                const loginResult = await invokeUsersAuthAction('login', { phone, password });
                const data = loginResult?.user;
                if (!data) throw new Error('تعذر إنشاء جلسة تسجيل الدخول.');
                saveUserSession(data, loginResult.sessionToken || '');

                if (rememberMeCheckbox && rememberMeCheckbox.checked) {
                    localStorage.setItem('savedPhone', phone);
                    localStorage.setItem('savedPassword', password);
                } else {
                    localStorage.removeItem('savedPhone');
                    localStorage.removeItem('savedPassword');
                }

                Swal.fire({
                    icon: 'success',
                    title: 'تم تسجيل الدخول بنجاح',
                    text: phone === 'admin' ? 'مرحباً أيها المدير' : `مرحباً بك، ${data.full_name || data.username}`,
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    if (data.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                        return;
                    }
                    if (data.role === 'rep' || data.role === 'مندوب فرعي') window.location.href = 'rep-dashboard.html';
                    else if (data.role === 'follower') window.location.href = 'followup-dashboard.html';
                    else if (data.role === 'housing') {
                        Swal.fire({
                            icon: 'error',
                            title: 'لا يمكن الدخول',
                            text: 'هذا الحساب لم يعد مدعومًا، برجاء التواصل مع الدعم الفني'
                        });
                    }
                    else throw new Error('دور المستخدم غير معروف');
                });

            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'فشل الدخول',
                    text: err.message
                });
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'تسجيل الدخول';
            }
        });

        repSignupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const signupRole = 'rep';
            const username = document.getElementById('signupName').value.trim();
            const phone = document.getElementById('signupPhone').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;

            if (!username || !phone || !email || !password) {
                Swal.fire({
                    icon: 'warning',
                    title: 'بيانات ناقصة',
                    text: 'يرجى استكمال الاسم ورقم الموبايل والبريد الإلكتروني وكلمة المرور.'
                });
                return;
            }

            if (password.length < 6) {
                Swal.fire({
                    icon: 'warning',
                    title: 'كلمة مرور ضعيفة',
                    text: 'يرجى استخدام 6 أحرف أو أرقام على الأقل.'
                });
                return;
            }

            if (password !== passwordConfirm) {
                Swal.fire({
                    icon: 'error',
                    title: 'كلمتا المرور غير متطابقتين',
                    text: 'تأكد من إعادة كتابة كلمة المرور بشكل صحيح.'
                });
                return;
            }

            signupBtn.disabled = true;
            signupBtn.innerHTML = 'جاري إنشاء الحساب...';

            try {
                await invokeUsersAuthAction('signup', {
                    username,
                    phone,
                    email: email || null,
                    passwordHash: await hashPassword(password),
                    role: signupRole
                });

                Swal.fire({
                    icon: 'success',
                    title: 'تم إنشاء الحساب',
                    text: 'تم إنشاء حسابك بنجاح. يرجى الانتظار حتى يقوم المدير بتفعيل الحساب لتتمكن من تسجيل الدخول.'
                }).then(() => {
                    toggleRepSignupModal(false);
                    window.location.href = 'login.html';
                });
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'تعذر إنشاء الحساب',
                    text: err.message || 'حدث خطأ أثناء إنشاء الحساب.'
                });
            } finally {
                signupBtn.disabled = false;
                signupBtn.innerHTML = '<span>إنشاء الحساب</span><i class="fas fa-user-plus"></i>';
            }
        });

        function toggleLoginPassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
