        .dark .popup-opt-gold.active { border-color: #eab308; background: rgba(250,204,21,0.2); color: #fef08a; }
        [class*="popup-opt-"]:hover:not(.active) { filter: brightness(0.96); }
        .dark [class*="popup-opt-"]:hover:not(.active) { filter: brightness(1.15); }
        .swal2-show,.swal2-hide{animation:none!important}.swal2-popup{transition:none!important}body.no-transitions, body.no-transitions * { transition: none !important; }
        @media (max-width: 420px) {
            .stat-card { padding: 8px 6px; }
            .stat-card .num { font-size: 1.05rem; }
            .filter-row select { font-size: 0.7rem; padding: 5px 6px; }
            .shipment-row { padding: 14px 14px; }
            .shipment-row .main { font-size: 0.9rem; }
            .shipment-row .field-label { font-size: 10px; }

<body>

<div class="max-w-3xl mx-auto px-3 py-4" id="app">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
        <div>
            <h1 class="greeting-text text-xl font-extrabold">مرحباً، <span id="repName">...</span></h1>
            <p class="text-sm font-medium text-slate-400" id="repRole">مندوب</p>

        <div class="flex items-center gap-2">
            <div style="position:relative">
                <button onclick="toggleNotifications()" class="icon-btn notif-btn" title="الإشعارات">
                    <i class="fas fa-bell"></i>
                    <span class="notif-badge" id="notifBadge" style="display:none">0</span>
                </button>
                <div class="notif-panel" id="notifPanel">
                    <div class="notif-empty" id="notifEmpty">لا توجد إشعارات</div>
                    <div id="notifList"></div>
                </div>
            </div>
            <button onclick="toggleTheme()" class="icon-btn" title="الوضع الليلي">
                <i id="themeIcon" class="fas fa-moon"></i>
            </button>
            <button onclick="exitAdminView()" id="adminBackIconBtn" class="icon-btn" title="العودة للوحة المدير" style="display:none"><i class="fas fa-building-user"></i></button>
            <button onclick="openAdminShipmentAdd()" id="adminAddShipmentBtn" class="icon-btn" title="إضافة شحنة" style="display:none"><i class="fas fa-plus"></i></button>
            <div style="position:relative">
                <button onclick="toggleMenu()" class="icon-btn" title="القائمة">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="menu-panel" id="menuPanel">
                    <div class="menu-item" onclick="toggleMenu();showEditAccount()">
                        <i class="fas fa-user-edit"></i> تعديل الحساب
                    </div>
                    <div class="menu-divider"></div>
                    <div class="menu-item logout-item" id="logoutMenuItem" onclick="toggleMenu();logout()">
                        <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
                    </div>

            </div>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-4 gap-2 mb-4" id="statsRow">
        <div class="stat-card text-center">
            <div class="num text-indigo-600 dark:text-indigo-400" id="statTotal">0</div>
            <div class="label">المدفوع</div>
        </div>
        <div class="stat-card text-center">
            <div class="num text-emerald-600 dark:text-emerald-400" id="statCommission">0</div>
            <div class="label">العمولة</div>
            <div class="text-xs font-medium opacity-70 mt-1" id="statTotalCount"></div>
        </div>
        <div class="stat-card text-center">
            <div class="num text-amber-600 dark:text-amber-400" id="statDelivery">0</div>
            <div class="label">التوريد</div>
            <div id="statDeliveryBreakdown" class="text-[0.6rem] font-medium opacity-70 mt-1 leading-tight"></div>
        </div>
        <div class="stat-card text-center">
            <div class="num text-rose-600 dark:text-rose-400" id="statShipments">0</div>
            <div class="label">الشحنات</div>
        </div>
    </div>

    <!-- Quick Status Cards -->
    <div class="grid grid-cols-4 gap-2 mb-4" id="quickStatusRow">
        <div class="stat-card text-center quick-status-card" data-status="قيد التوصيل" onclick="clickStatusStat('قيد التوصيل')" style="cursor:pointer;">
            <div class="num text-amber-500" id="statQuickPending">0</div>
            <div class="label">قيد التوصيل</div>
        </div>
        <div class="stat-card text-center quick-status-card" data-status="مفضلة" onclick="clickStatusStat('مفضلة')" style="cursor:pointer;">
            <div class="num text-pink-500" id="statQuickFavorite">0</div>
            <div class="label">المفضلة</div>
        </div>
        <div class="stat-card text-center quick-status-card" data-status="بحاجة لمتابعة" onclick="clickStatusStat('بحاجة لمتابعة')" style="cursor:pointer;">
            <div class="num text-cyan-500" id="statQuickFollowup">0</div>
            <div class="label">بحاجة لمتابعة</div>
        </div>
        <div class="stat-card text-center quick-status-card" data-status="مؤجل" onclick="clickStatusStat('مؤجل')" style="cursor:pointer;">
            <div class="num text-orange-500" id="statQuickPostponed">0</div>
            <div class="label">مؤجل</div>
        </div>
    </div>

    <!-- Done/Edit/Ship/Cancel Cards -->
    <div class="grid grid-cols-4 gap-2 mb-4" id="doneStatusRow">
        <div class="stat-card text-center quick-status-card" data-status="تم" onclick="clickStatusStat('تم')" style="cursor:pointer;">
            <div class="num text-emerald-500" id="statQuickDone">0</div>
            <div class="label">تم</div>
            <div id="statDeliveredBreakdown" class="text-[0.6rem] font-medium mt-1 leading-tight" style="color:#64748b;">&nbsp;</div>
        </div>
        <div class="stat-card text-center quick-status-card" data-status="تعديل سعر" onclick="clickStatusStat('تعديل سعر')" style="cursor:pointer;">
            <div class="num text-purple-500" id="statQuickPriceEdit">0</div>
            <div class="label">تعديل سعر</div>
            <div id="statPriceEditBreakdown" class="text-[0.6rem] font-medium mt-1 leading-tight" style="color:#64748b;">&nbsp;</div>
        </div>
        <div class="stat-card text-center quick-status-card" data-status="شحن" onclick="clickStatusStat('شحن')" style="cursor:pointer;">
            <div class="num text-indigo-500" id="statQuickShipped">0</div>
            <div class="label">شحن</div>
            <div id="statShippedBreakdown" class="text-[0.6rem] font-medium mt-1 leading-tight" style="color:#64748b;">&nbsp;</div>
        </div>
        <div class="stat-card text-center quick-status-card" data-status="الغاء" onclick="clickStatusStat('الغاء')" style="cursor:pointer;">
            <div class="num text-red-500" id="statQuickCancelled">0</div>
            <div class="label">الغاء</div>
        </div>
    </div>

    <!-- Progress Bar -->
    <div class="glass p-3 mb-3">
        <div class="flex items-center justify-between mb-1">
                    <span class="text-sm font-bold text-slate-600 dark:text-slate-300">نسبة الإنجاز</span>
                    <span class="text-sm font-extrabold text-indigo-600 dark:text-indigo-400" id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-custom">
            <div class="fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="flex justify-between mt-1.5 text-xs font-semibold text-slate-400">
            <span>تم <span id="progressDelivered">0</span></span>
            <span>متبقي <span id="progressRemaining">0</span></span>
        </div>
    </div>

    <!-- Search + Filters (Sticky) -->
    <div class="sticky top-0 z-20 pt-2 pb-1" style="background:inherit;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)">
        <div class="flex gap-1.5 items-center mb-1.5">
            <input type="text" id="searchInput" class="flex-1 p-3 rounded-xl border dark:border-slate-600 bg-white/90 text-base text-slate-800 dark:text-gray-100 placeholder-slate-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 transition-all" placeholder="🔍 بحث بكود الشحنة / العميل / الهاتف / هاتف بديل" oninput="onFilterChange()">
            <button id="toggleActionsBtn" class="shipment-eye-btn" onclick="toggleRepActions()" title="إخفاء/إظهار الأزرار"><i class="fas fa-eye-slash"></i></button>
        </div>
        <div class="filter-row grid grid-cols-4 gap-2">
            <select id="filterDaily" style="display:none" onchange="onFilterChange()"><option value="">اليومية</option></select>
            <select id="filterZone" style="display:none" onchange="onFilterChange()"><option value="">الزون</option></select>
            <select id="filterSender" style="display:none" onchange="onFilterChange()"><option value="">الراسل</option></select>
            <button class="filter-chip" id="chipArchive" data-placeholder-active="📁 نشطة" data-placeholder-archived="📁 مؤرشفة" onclick="toggleRepArchiveFilter()">📁 نشطة</button>
            <button class="filter-chip" id="chipDaily" data-placeholder="📅 اليومية" onclick="openFilterChip('daily')">📅 اليومية</button>
            <button class="filter-chip" id="chipZone" data-placeholder="📍 الزون" onclick="openFilterChip('zone')">📍 الزون</button>
            <button class="filter-chip" id="chipSender" data-placeholder="🏢 الراسل" onclick="openFilterChip('sender')">🏢 الراسل</button>
            <select id="filterRep" style="display:none" onchange="onFilterChange()"><option value="">المندوب</option></select>
            <button class="filter-chip" id="chipRep" data-placeholder="👤 المندوب" onclick="openFilterChip('rep')" style="display:none">👤 المندوب</button>
        </div>
    </div>

    <!-- Shipments List -->
    <div id="shipmentsContainer">
        <div class="empty-state"><i class="fas fa-box-open text-4xl mb-3 opacity-50"></i><p class="font-bold">اختر اليومية لعرض الشحنات</p></div>
    </div>
</div>

<script src="assets/js/shipment-config.js?v=F8F696B76F"></script>
<script>
    const BUILD = '7';
    try {
        const _buildUrl = new URL(window.location.href);
        if (_buildUrl.searchParams.get('_t') !== BUILD) {
            _buildUrl.searchParams.set('_t', BUILD);
            localStorage.setItem('rep-version', BUILD);
            window.location.href = _buildUrl.toString();
        }
    } catch (e) { try { localStorage.setItem('rep-version', BUILD); } catch (e2) {} }
    const supabaseClient = getSharedSupabaseClient();
    let actionsHidden = false;
    function toggleRepActions() {
        actionsHidden = !actionsHidden;
        repStoreSet('rep-actions-hidden', actionsHidden ? 'true' : 'false');
        document.querySelectorAll('.action-btns').forEach(el => el.classList.toggle('hidden-actions', actionsHidden));
        const btn = document.getElementById('toggleActionsBtn');
        if (btn) btn.innerHTML = '<i class="fas ' + (actionsHidden ? 'fa-eye' : 'fa-eye-slash') + '"></i>';
    }
    let currentUser = JSON.parse(localStorage.getItem('user'));

    /* ===== وضع «عرض كمدير» (تصفح المدير لشحنات مندوب معيّن) =====
       يُفعّل عبر rep-dashboard.html?adminMode=1&repName=<اسم المندوب> من لوحة الإدارة.
       - لا يغيّر دور المستخدم ولا يمنح صلاحية إضافية في قاعدة البيانات (نفس صلاحيات المدير).
       - يعزل مفاتيح الحالة تحت adminView:<اليومية>:<key> فلا يمس مفاتيح المندوب الحقيقية،
         ومع ذلك تبقى حالة كل مندوب محفوظة داخل نفس الجلسة عند التبديل بينهم.
       - يُمسح تلقائياً بإغلاق التاب (sessionStorage) أو بزر العودة في القائمة. */
    const _repParams = new URLSearchParams(window.location.search);
    const _isAdminUser = !!(currentUser && currentUser.role === 'admin');
    if (_isAdminUser && _repParams.get('adminMode') === '1') {
        try {
            sessionStorage.setItem('adminViewMode', '1');
            if (_repParams.get('repName')) sessionStorage.setItem('adminViewRepName', _repParams.get('repName'));
        } catch (e) {}
    }
    const adminViewMode = _isAdminUser && (_repParams.get('adminMode') === '1' || sessionStorage.getItem('adminViewMode') === '1');
    const adminViewRepName = adminViewMode ? (_repParams.get('repName') || sessionStorage.getItem('adminViewRepName') || '') : '';
    /* وضع «اليومية أولًا»: اليومية هي بوابة التحميل في وضع المدير (تُختار أولاً ثم تُحمَّل كل شحناتها بكل المناديب). */
    if (adminViewMode) {
        try {
            document.getElementById('filterDaily').value = sessionStorage.getItem('adminViewDaily') || '';
        } catch (e) {}
    }
    function repKey(name) { return adminViewMode ? ('adminView:' + (document.getElementById('filterDaily').value || '__none__') + ':' + name) : name; }
    function repStoreGet(name) { try { return localStorage.getItem(repKey(name)); } catch (e) { return null; } }
    function repStoreSet(name, val) { try { localStorage.setItem(repKey(name), val); } catch (e) {} }
    function repStoreRemove(name) { try { localStorage.removeItem(repKey(name)); } catch (e) {} }
    function exitAdminView() {
        try { sessionStorage.removeItem('adminViewMode'); sessionStorage.removeItem('adminViewRepName'); } catch (e) {}
        window.location.href = 'admin-dashboard.html';
    }
    window.exitAdminView = exitAdminView;

    actionsHidden = repStoreGet('rep-actions-hidden') === 'true';
    let allShipments = [];
    let filteredShipments = [];
    let currentStatusFilter = '';
    let repArchiveFilter = repStoreGet('repArchiveFilter') || 'نشطة';
    let adminArchiveGateChosen = true;

    function isArchivedShipment(s) {
        const v = s && s['ارشيف'];
        if (typeof v === 'boolean') return v;
        if (v == null) return false;
        const t = String(v).trim().toLowerCase();
        return t === 'true' || t === '1' || t === 't' || t === 'yes' || t === 'y' || t === 'نعم';
    }

    function enNum(s) {
        return String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    }

    let notifications = [];
    let notifSnapshot = {};
    let filterData = { daily: [], status: [], zone: [], sender: [] };
    let filterCounts = { daily: {}, status: {}, zone: {}, sender: {} };

    function saveSnapshot() {
        const snap = {};
        allShipments.forEach(s => { snap[s.id] = s['الحالة'] || ''; });
        notifSnapshot = snap;
        repStoreSet('repNotifSnapshot', JSON.stringify(snap));
    }

    function loadSnapshot() {
        try { notifSnapshot = JSON.parse(repStoreGet('repNotifSnapshot')) || {}; } catch (e) { notifSnapshot = {}; }
    }

    function getFavorites() {
        try { return JSON.parse(repStoreGet('repFavorites')) || {}; } catch (e) { return {}; }
    }
    function saveFavorites(fav) { repStoreSet('repFavorites', JSON.stringify(fav)); }
    function isFavorite(id) { return !!getFavorites()[id]; }
    function toggleFavorite(id) {
        const fav = getFavorites();
        if (fav[id]) { delete fav[id]; } else { fav[id] = Date.now(); }
        saveFavorites(fav);
        applyFilters();
    }
    function removeFavorite(id) {
        const fav = getFavorites();
        if (fav[id]) { delete fav[id]; saveFavorites(fav); }
    }

    function getFollowupsSent() {
        try { return JSON.parse(repStoreGet('repFollowupsSent')) || {}; } catch (e) { return {}; }
    }
    function saveFollowupsSent(obj) { repStoreSet('repFollowupsSent', JSON.stringify(obj)); }
    function markFollowupSent(id) { const o = getFollowupsSent(); o[id] = true; saveFollowupsSent(o); }

    function getFollowupsDismissed() {
        try { return JSON.parse(repStoreGet('repFollowupsDismissed')) || {}; } catch (e) { return {}; }
    }
    function saveFollowupsDismissed(obj) { repStoreSet('repFollowupsDismissed', JSON.stringify(obj)); }
    function markFollowupDismissed(id) { const o = getFollowupsDismissed(); o[id] = true; saveFollowupsDismissed(o); }

    function checkNotifications(isInitial) {
        if (!allShipments.length) return;
        const oldIds = new Set(Object.keys(notifSnapshot));
        const now = new Date();
        const timeStr = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        allShipments.forEach(s => {
            const id = String(s.id);
            const oldStatus = notifSnapshot[id] || '';
            const newStatus = s['الحالة'] || '';
            if (oldStatus && oldStatus !== newStatus) {
                const customer = s['اسم العميل'] || s['كود الشحنة'] || id;
                notifications.unshift({ title: `تحديث حالة: ${customer}`, desc: `${oldStatus} ← ${newStatus} • ${timeStr}`, time: timeStr });
            } else if (!isInitial && !oldStatus && newStatus) {
                const customer = s['اسم العميل'] || s['كود الشحنة'] || id;
                notifications.unshift({ title: `شحنة جديدة: ${customer}`, desc: `الحالة: ${newStatus} • ${timeStr}`, time: timeStr });
            }
        });
        if (notifications.length > 50) notifications = notifications.slice(0, 50);
        saveSnapshot();
        renderNotifications();
    }

    function renderNotifications() {
        const badge = document.getElementById('notifBadge');
        const list = document.getElementById('notifList');
        const empty = document.getElementById('notifEmpty');
        if (notifications.length) {
            badge.style.display = 'flex';
            badge.textContent = notifications.length > 99 ? '99+' : notifications.length;
            empty.style.display = 'none';
            list.innerHTML = notifications.map(n => `<div class="notif-item"><div class="notif-title">${n.title}</div><div class="notif-desc">${n.desc}</div></div>`).join('');
        } else {
            badge.style.display = 'none';
            empty.style.display = 'block';
            list.innerHTML = '';
        }
    }

    let notifOpen = false;
    function toggleNotifications() {
        notifOpen = !notifOpen;
        document.getElementById('notifPanel').classList.toggle('show', notifOpen);
    }
    document.addEventListener('click', (e) => {
        if (notifOpen && !e.target.closest('#notifPanel') && !e.target.closest('.notif-btn')) {
            notifOpen = false;
            document.getElementById('notifPanel').classList.remove('show');
        }
    });

    if (!currentUser || (!['rep', 'مندوب فرعي'].includes(currentUser.role) && !(currentUser.role === 'admin' && adminViewMode))) {
        window.location.href = 'login.html';
    }
    const repDisplayName = adminViewMode ? adminViewRepName : (currentUser.full_name || currentUser.username || '');
    if (adminViewMode) {
        const _adminDailyHere = document.getElementById('filterDaily').value;
        document.getElementById('repName').textContent = _adminDailyHere ? ('عرض يومية: ' + _adminDailyHere) : 'اختر يومية';
        const _repRoleEl = document.getElementById('repRole');
        if (_repRoleEl) _repRoleEl.textContent = 'وضع المدير — تصفح اليوميات';
    } else {
        document.getElementById('repName').textContent = repDisplayName;
    }

    if (localStorage.getItem('shipment-theme') === 'dark' || (!localStorage.getItem('shipment-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark');
        document.getElementById('themeIcon').className = 'fas fa-sun';
    }

    function toggleTheme() {
        document.body.classList.add('no-transitions');
        const isDark = document.body.classList.toggle('dark');
        document.getElementById('themeIcon').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        localStorage.setItem('shipment-theme', isDark ? 'dark' : 'light');
        document.documentElement.classList.toggle('light-forced', !isDark);
        requestAnimationFrame(() => document.body.classList.remove('no-transitions'));
    }

    function logout() {
        clearStoredUserSession('login.html');
    }

    let menuOpen = false;
    function toggleMenu() {
        menuOpen = !menuOpen;
        document.getElementById('menuPanel').classList.toggle('show', menuOpen);
    }
    document.addEventListener('click', (e) => {
        if (menuOpen && !e.target.closest('#menuPanel') && !e.target.closest('.fa-bars') && !e.target.closest('[onclick*="toggleMenu"]')) {
            menuOpen = false;
            document.getElementById('menuPanel').classList.remove('show');
        }
    });

    function showEditAccount() {
        const user = currentUser;
        const isDark = document.body.classList.contains('dark');
        Swal.fire({
            title: 'تعديل الحساب',
            background: isDark ? '#0f172a' : '#fff',
            color: isDark ? '#f8fafc' : '#0f172a',
            html: `
                <div class="text-right">
                    <label class="text-sm font-bold ${isDark ? 'text-slate-300' : 'text-slate-600'}">الاسم</label>
                    <input type="text" id="editName" readonly class="w-full p-2.5 rounded-xl border ${isDark ? 'border-slate-600 bg-slate-800 text-white' : 'border-slate-300 bg-white'} text-sm mt-1 mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-400 opacity-75" value="${user.full_name || user.username || ''}">
                    <label class="text-sm font-bold ${isDark ? 'text-slate-300' : 'text-slate-600'}">رقم الهاتف</label>
                    <input type="text" id="editPhone" class="w-full p-2.5 rounded-xl border ${isDark ? 'border-slate-600 bg-slate-800 text-white' : 'border-slate-300 bg-white'} text-sm mt-1 mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-400" value="${user.phone || ''}">
                    <label class="text-sm font-bold ${isDark ? 'text-slate-300' : 'text-slate-600'}">كلمة المرور الجديدة (اترك فارغاً إذا لا تريد التغيير)</label>
                    <input type="password" id="editPass" class="w-full p-2.5 rounded-xl border ${isDark ? 'border-slate-600 bg-slate-800 text-white' : 'border-slate-300 bg-white'} text-sm mt-1 focus:outline-none focus:ring-2 focus:ring-indigo-400" placeholder="أدخل كلمة المرور الجديدة">
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: 'حفظ',
            cancelButtonText: 'الغاء',
            confirmButtonColor: '#22c55e',
            customClass: {
                popup: isDark ? 'swal-dark' : '',
                title: isDark ? 'swal-title-dark' : ''
            },
            preConfirm: () => {
                const name = document.getElementById('editName').value.trim();
                const phone = document.getElementById('editPhone').value.trim();
                const pass = document.getElementById('editPass').value;
                if (!name) { Swal.showValidationMessage('يرجى إدخال الاسم'); return false; }
                if (!phone) { Swal.showValidationMessage('يرجى إدخال رقم الهاتف'); return false; }
                return { name, phone, pass };
            }
        }).then(async (result) => {
            if (!result.isConfirmed) return;
            const { name, phone, pass } = result.value;
            try {
                const updates = { username: name, phone: phone };
                if (pass) updates.password = pass;
                const { error } = await supabaseClient
                    .from('users')
                    .update(updates)
                    .eq('id', user.id);
                if (error) throw error;
                if (pass) {
                    const { error: authError } = await supabaseClient.auth.updateUser({ password: pass });
                    if (authError) throw authError;
                }
                Object.assign(currentUser, { full_name: name, username: phone });
                localStorage.setItem('user', JSON.stringify(currentUser));
                document.getElementById('repName').textContent = name;

    /* ===== ترتيب زمني لقيم "اليومية" النصية =====
       قيمة "اليومية" في النظام نص عربي بصيغة مثل: الاحد5-7، الاربع1-7، السبت10-12
       (اسم يوم + يوم-شهر، بدون سنة) كما هو موثّق في housing-dashboard.html
       (parseDailyStringToSortKey / sortDailyValuesList). قد تظهر أيضاً صيغ أخرى
       (ISO YYYY-MM-DD، يوم/شهر/سنة، اسم شهر عربي، رقم Excel التسلسلي) كما في
       admin-dashboard.html (parseDate). الدوال التالية تُنتج مفتاح ترتيب موحّداً
       لكل صيغة، والترتيب يكون من الأحدث إلى الأقدم. أي قيمة لا تُماثل أي صيغة
       معروفة تُرتب في نهاية القائمة دون حذفها ودون كراش. */
    function repDailyToSortKey(str) {
        let s = String(str || '').trim();
        if (!s) return { ok: false };
        // تطبيع الأرقام العربية / الفارسية إلى ASCII
        s = s
            .replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
            .replace(/[۰-۹]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); });

        // رقم تسلسلي Excel (شائع مع البيانات المرفوعة من ملفات Excel)
        if (/^\d{5,6}$/.test(s)) {
            var serial = Date.UTC(1899, 11, 30) + parseInt(s, 10) * 86400000;
            var e = new Date(serial);
            if (!isNaN(e.getTime()) && e.getUTCFullYear() > 1990 && e.getUTCFullYear() < 2100) {
                return { ok: true, y: e.getUTCFullYear(), m: e.getUTCMonth() + 1, d: e.getUTCDate() };
            }
            return { ok: false };
        }

        var m;
        // ISO: YYYY-MM-DD (مع أو بدون وقت)
        m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (m) return { ok: true, y: parseInt(m[1], 10), m: parseInt(m[2], 10), d: parseInt(m[3], 10) };
        // يوم/شهر/سنة
        m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
        if (m) return { ok: true, y: parseInt(m[3], 10), m: parseInt(m[2], 10), d: parseInt(m[1], 10) };
        // اسم شهر عربي: "15 يناير 2024"
        m = s.match(/(\d{1,2})\s*([\u0600-\u06FF]+)\s*(\d{4})/);
        if (m) {
            var names = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
            var mi = names.indexOf(m[2]);
            if (mi !== -1) return { ok: true, y: parseInt(m[3], 10), m: mi + 1, d: parseInt(m[1], 10) };
        }
        // صيغة اليومية العربية: "الاحد5-7" (يوم-شهر، بدون سنة)
        m = s.match(/(\d{1,2})-(\d{1,2})/);
        if (m) {
            var day = parseInt(m[1], 10), month = parseInt(m[2], 10);
            if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
                return { ok: true, y: null, m: month, d: day }; // y = null للصيغة بلا سنة
            }
            return { ok: false };
        }
        return { ok: false };
    }

    /* صيغة بلا سنة (مثل الاحد5-7): نعتمد العام الحالي لمعاملتها مع أي صيغ تحمل سنة */
    function repDailyYearBase(k) {
        var now = new Date();
        var y = k.y != null ? k.y : now.getFullYear();
        return y * 10000 + k.m * 100 + k.d;
    }

    /* "شحنة قديمة": قيمة عمود "التاريخ" أقدم (سابقة) من تاريخ اليوم وقت العرض.
       يعتمد على نفس منطق repDailyToSortKey (ISO / يوم-شهر-سنة / تسلسلي Excel /
       اسم شهر عربي / يوم-شهر بلا سنة)، وأي قيمة فارغة أو غير قابلة للتحليل بثقة
       لا تُعتبر قديمة (تُرجع false). */
    function repShipmentIsOld(val) {
        if (val == null || String(val).trim() === '') return false;
        const k = repDailyToSortKey(val);
        if (!k.ok) return false;
        const now = new Date();
        const today = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
        return repDailyYearBase(k) < today;
    }

    /* يرتب قائمة اليوميات من الأحدث إلى الأقدم (غير المعروفة في النهاية) */
    function repSortDailyValues(list) {
        var tagged = list.map(function (v) { return { v: v, k: repDailyToSortKey(v) }; });
        return tagged.sort(function (a, b) {
            var ka = a.k, kb = b.k;
            if (ka.ok !== kb.ok) return ka.ok ? -1 : 1;      // المعروفة أولاً
            if (!ka.ok) return a.v.localeCompare(b.v, 'ar');  // المجهولة في النهاية أبجدياً
            var av = repDailyYearBase(ka), bv = repDailyYearBase(kb);
            if (bv !== av) return bv - av;                    // الأحدث أولاً
            return b.v.localeCompare(a.v, 'ar');              // عند التساوي: أبجدي عكسي
        }).map(function (x) { return x.v; });
    }

    let adminRepPresetDone = false;
    const NO_REP_VALUE = '__NO_REP__';
    let noRepCount = 0;
    function populateFilters() {
        const dailySel = document.getElementById('filterDaily').value;
        const base = dailySel ? allShipments.filter(s => (s['اليومية'] || '') === dailySel) : allShipments;

        const archivedDailies = new Set(allShipments.filter(s => isArchivedShipment(s)).map(s => s['اليومية'] || '').filter(Boolean));
        let rawDailies;
        let dailyCounts = {};
        if (adminViewMode && adminDailiesList.length && adminArchiveGateChosen) {
            const gate = repArchiveFilter;
            const matching = adminDailiesList.filter(d => gate === 'نشطة' ? (d.activeCount || 0) > 0 : (d.archivedCount || 0) > 0);
            rawDailies = matching.map(d => d.name);
            matching.forEach(d => { dailyCounts[d.name] = (gate === 'نشطة' ? (d.activeCount || 0) : (d.archivedCount || 0)) || 0; });
        } else if (adminViewMode) {
            rawDailies = [];
        } else {
            rawDailies = [...new Set(allShipments.map(s => s['اليومية'] || '').filter(Boolean))].filter(d =>
                (repArchiveFilter === 'نشطة' && !archivedDailies.has(d)) ||
                (repArchiveFilter === 'مؤرشفة' && archivedDailies.has(d))
            );
        }
        const dailies = repSortDailyValues(rawDailies);
        if (!adminViewMode) {
            const rawSet = new Set(rawDailies);
            allShipments.forEach(s => { const k = s['اليومية'] || ''; if (k && rawSet.has(k)) dailyCounts[k] = (dailyCounts[k] || 0) + 1; });
        }
        const statuses = [...new Set(allShipments.map(s => s['الحالة'] || '').filter(Boolean))].sort();
        const zones = [...new Set(base.map(s => String(s['الزون'] || '').trim()).filter(Boolean))].sort();
        const senders = [...new Set(base.map(s => String(s['الراسل'] || '').trim()).filter(Boolean))].sort();

        const zoneCounts = {};
        const senderCounts = {};
        const repNames = [];
        const repCounts = {};
        noRepCount = 0;
        base.forEach(s => {
            const zn = String(s['الزون'] || '').trim();
            if (zn) zoneCounts[zn] = (zoneCounts[zn] || 0) + 1;
            const sr = String(s['الراسل'] || '').trim();
            if (sr) senderCounts[sr] = (senderCounts[sr] || 0) + 1;
            if (adminViewMode) {
                const rp = String(s['المندوب'] || '').trim();
                if (rp) {
                    if (repNames.indexOf(rp) === -1) repNames.push(rp);
                    repCounts[rp] = (repCounts[rp] || 0) + 1;
                } else {
                    noRepCount++;
                }
            }
        });

        setOptions('filterDaily', dailies, dailyCounts);
        setOptions('filterZone', zones, zoneCounts);
        setOptions('filterSender', senders, senderCounts);
        filterData = { daily: dailies, zone: zones, sender: senders, rep: adminViewMode ? repNames : [] };
        filterCounts = { daily: dailyCounts, zone: zoneCounts, sender: senderCounts, rep: adminViewMode ? repCounts : {} };
        if (adminViewMode) {
            const selRep = document.getElementById('filterRep');
            if (selRep && !adminRepPresetDone) selRep.value = repDisplayName;
            adminRepPresetDone = true;
        }
        updateChips();
    }
    function updateChips() {
        const chipTypes = adminViewMode ? ['daily','zone','sender','rep'] : ['daily','zone','sender'];
        chipTypes.forEach(t => {
            const sel = document.getElementById('filter' + t.charAt(0).toUpperCase() + t.slice(1));
            const chip = document.getElementById('chip' + t.charAt(0).toUpperCase() + t.slice(1));
            if (!sel || !chip) return;
            const val = sel.value;
            const chipLabel = (t === 'rep' && val === NO_REP_VALUE) ? 'بدون مندوب' : val;
            chip.textContent = chipLabel || chip.dataset.placeholder;
            chip.classList.toggle('active', !!val);
        });
        const archiveChip = document.getElementById('chipArchive');
        if (archiveChip) {
            const isActive = repArchiveFilter === 'نشطة';
            let count;
            if (adminViewMode && adminDailiesList.length) {
                count = isActive
                    ? adminDailiesList.filter(d => (d.activeCount || 0) > 0).length
                    : adminDailiesList.filter(d => (d.archivedCount || 0) > 0).length;
            } else {
                const allDailies = new Set(allShipments.map(s => s['اليومية'] || '').filter(Boolean));
                const archivedDailies = new Set(allShipments.filter(s => isArchivedShipment(s)).map(s => s['اليومية'] || '').filter(Boolean));
                count = isActive ? (allDailies.size - archivedDailies.size) : archivedDailies.size;
            }
            const label = isActive ? archiveChip.dataset.placeholderActive : archiveChip.dataset.placeholderArchived;
            archiveChip.textContent = label + ' (' + count + ')';
            archiveChip.classList.toggle('active', isActive);
        }

            ...items.map(v => `<div data-type="${type}" data-value="${v.replace(/"/g,'&quot;')}" onclick="selectFilterChip(this)" class="p-2.5 rounded-xl border-2 cursor-pointer text-center font-bold text-sm ${current === v ? activeColors[ci] : chipColors[ci]}">${v}${type === 'daily' && archivedDailies.has(v) ? ' 📦' : ''} (${counts[v] || 0})</div>`),
        '</div>'].join('');
        Swal.fire({ title, html: optsHtml, showCancelButton: true, cancelButtonText: 'الغاء', showConfirmButton: false });

        const daily = document.getElementById('filterDaily').value;
        if (!daily) return [];

    function applyFilters() {
        saveFilters();
        const daily = document.getElementById('filterDaily').value;
        if (!daily) return;
        populateFilters();
        const status = currentStatusFilter;
        const zone = document.getElementById('filterZone').value;
        const sender = document.getElementById('filterSender').value;
        const rep = adminViewMode ? document.getElementById('filterRep').value : '';
        const searchTerm = document.getElementById('searchInput').value.trim();

        filteredShipments = getDailyShipments().filter(s => {
            const sid = String(s.id);
            const sStatus = s['الحالة'] || '';
            const favored = isFavorite(sid);

            if (status === 'مفضلة') {
                if (!favored) return false;
            } else {
                /* اي شحنة مفضلة تُستبعد من جميع الفلاتر الاخري بما فيها "بحاجة لمتابعة" */
                if (favored) return false;

                if (status === 'بحاجة لمتابعة') {
                    const followupStatuses = ['الغاء', 'مؤجل', 'تعديل سعر', 'شحن'];
                    if (!followupStatuses.includes(sStatus)) return false;
                    const dismissed = getFollowupsDismissed();
                    if (dismissed[sid]) return false;
                } else {
                    if (status && sStatus !== status) return false;
                }
            }
            if (zone && String(s['الزون'] || '').trim() !== zone) return false;
            if (sender && String(s['الراسل'] || '').trim() !== sender) return false;
            if (rep === NO_REP_VALUE) {
                if (String(s['المندوب'] || '').trim() !== '') return false;
            } else if (rep && String(s['المندوب'] || '').trim() !== rep) {
                return false;
            }
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                const match = (s['كود الشحنة'] || '').toLowerCase().includes(term)
                    || (s['اسم العميل'] || '').toLowerCase().includes(term)
                    || (s['الهاتف'] || '').toLowerCase().includes(term)
                    || (s['هاتف بديل'] || '').toLowerCase().includes(term);
                if (!match) return false;
            }
            return true;
        });

        /* فلترة "نشطة/مؤرشفة" */
        if (repArchiveFilter === 'نشطة') {
            filteredShipments = filteredShipments.filter(s => !isArchivedShipment(s));
        } else {
            filteredShipments = filteredShipments.filter(s => isArchivedShipment(s));
        }

        /* ترتيب خاص بفلتر "مفضلة" فقط: الاكثر تفضيلا حديثا يظهر اولا */
        if (status === 'مفضلة') {
            const fav = getFavorites();
            filteredShipments = filteredShipments
                .slice()
                .sort((a, b) => (fav[String(b.id)] || 0) - (fav[String(a.id)] || 0));
        }

        updateStats();
        renderShipments();
        // Update active state on status stat cards
        document.querySelectorAll('.quick-status-card').forEach(function(el) {
            el.classList.toggle('active', el.dataset.status === status);
        });
    }

        document.getElementById('statCommission').textContent = enNum('0');
        document.getElementById('statDelivery').textContent = enNum('0');
        document.getElementById('statDeliveryBreakdown').textContent = '';

        });

    function updateStats() {
        const dailyShipments = getDailyShipments();
        const doneStatuses = ['تم', 'تم التسليم', 'شحن', 'تعديل سعر', 'استلم جزئي'];
        const doneShipments = dailyShipments.filter(s => doneStatuses.includes(s['الحالة'] || ''));
        const total = doneShipments.reduce((sum, s) => sum + (parseFloat(s['المدفوع']) || 0), 0);
        const commission = doneShipments.reduce((sum, s) => sum + (parseFloat(s['عمولة المندوب']) || 0), 0);
        const delivered = doneShipments.length;
        const deliveryTotal = total - commission;

        document.getElementById('statTotal').textContent = enNum(Math.round(total));
        document.getElementById('statTotalCount').textContent = enNum(doneShipments.length) + ' شحنة';
        document.getElementById('statCommission').textContent = enNum(Math.round(commission));
        document.getElementById('statShipments').textContent = enNum(dailyShipments.length);

        var pending = 0, deliveredCount = 0, cancelled = 0, priceEdit = 0, shipped = 0, postponed = 0;
        dailyShipments.forEach(function(s) {
            var st = s['الحالة'] || '';
            if (st === 'قيد التوصيل') pending++;
            else if (st === 'تم' || st === 'تم التسليم') deliveredCount++;
            else if (st === 'الغاء' || st === 'إلغاء') cancelled++;
            else if (st === 'تعديل سعر') priceEdit++;
            else if (st === 'شحن') shipped++;
            else if (st === 'مؤجل') postponed++;
        });
        document.getElementById('statDelivery').textContent = enNum(Math.round(deliveryTotal));
        document.getElementById('statQuickPending').textContent = enNum(pending);
        document.getElementById('statQuickDone').textContent = enNum(deliveredCount);
        var deliveredPaid = dailyShipments.filter(function(s) { var st = s['الحالة'] || ''; return st === 'تم' || st === 'تم التسليم'; }).reduce(function(sum, s) { return sum + (parseFloat(s['المدفوع']) || 0); }, 0);
        document.getElementById('statDeliveredBreakdown').textContent = enNum(Math.round(deliveredPaid));
        document.getElementById('statQuickCancelled').textContent = enNum(cancelled);
        document.getElementById('statQuickPriceEdit').textContent = enNum(priceEdit);
        var priceEditPaid = dailyShipments.filter(function(s) { return (s['الحالة'] || '') === 'تعديل سعر'; }).reduce(function(sum, s) { return sum + (parseFloat(s['المدفوع']) || 0); }, 0);
        document.getElementById('statPriceEditBreakdown').textContent = enNum(Math.round(priceEditPaid));
        document.getElementById('statQuickShipped').textContent = enNum(shipped);
        var shippedPaid = dailyShipments.filter(function(s) { return (s['الحالة'] || '') === 'شحن'; }).reduce(function(sum, s) { return sum + (parseFloat(s['المدفوع']) || 0); }, 0);
        document.getElementById('statShippedBreakdown').textContent = enNum(Math.round(shippedPaid));
        document.getElementById('statQuickPostponed').textContent = enNum(postponed);

        const followupStatuses = ['الغاء', 'مؤجل', 'تعديل سعر', 'شحن'];
        const dismissed = getFollowupsDismissed();
        const needsFollowup = dailyShipments.filter(s => followupStatuses.includes(s['الحالة'] || '') && !dismissed[String(s.id)]).length;
        document.getElementById('statQuickFollowup').textContent = enNum(needsFollowup);

        var favoriteCount = Object.keys(getFavorites()).length;
        document.getElementById('statQuickFavorite').textContent = enNum(favoriteCount);

        document.getElementById('statDeliveryBreakdown').textContent = enNum(priceEdit + shipped + cancelled + postponed);

        const pct = dailyShipments.length ? Math.round((delivered / dailyShipments.length) * 100) : 0;
        document.getElementById('progressPercent').textContent = enNum(pct) + '%';
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressDelivered').textContent = enNum(delivered);
        document.getElementById('progressRemaining').textContent = enNum(dailyShipments.length - delivered);
    }

    async function updateShipmentStatus(idx, status) {
        const shipment = filteredShipments[idx];
        if (!shipment) return Swal.fire('خطأ', 'لم يتم العثور على الشحنة', 'error');
        if (isArchivedShipment(shipment)) return Swal.fire('غير مسموح', 'لا يمكن تعديل شحنة مؤرشفة', 'warning');
        try {
            const payload = { الحالة: status };
            const _srcStatus = (shipment['الحالة'] || '').trim();
            if (['تم', 'تم التسليم', 'تعديل سعر', 'شحن'].includes(_srcStatus) && status !== _srcStatus) {
                payload['المدفوع'] = null;
                payload['سبب الحالة'] = '';
            }
            if (status === 'تم') {
                payload['المدفوع'] = shipment['المبلغ'] || '0';
            }
            const { error } = await supabaseClient
                .from(CONFIG.TABLES.SHIPMENTS)
                .update(payload)
                .eq('id', shipment.id);
            if (error) throw error;
            Object.assign(shipment, payload);
            removeFavorite(String(shipment.id));
            applyFilters();
            Swal.fire({ icon: 'success', title: 'تم تحديث الحالة', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });
        } catch (err) {
            Swal.fire('خطأ', err.message, 'error');
        }
    }

    /* تعديل تفاصيل الشحنة الكامل — متاح في وضع «عرض كمدير» فقط.
       ينسخ قواعد housing: منع المؤرشفة، إلزام المدفوع لحالتي «تعديل سعر/شحن»،
       مسح المندوب عند «مجاش»، ومسح سبب الحالة/المدفوع عند مغادرة حالة منجزة. */
    function openAdminShipmentEditor(idx) {
        const s = filteredShipments[idx];
        if (!s) return;
        if (!adminViewMode) return;
        if (isArchivedShipment(s)) return Swal.fire('غير مسموح', 'لا يمكن تعديل شحنة مؤرشفة', 'warning');

    /* ===== إضافة شحنة (وضع «عرض كمدير» فقط) =====
       زر «+» في الشريط العلوي بجانب زر العودة للوحة المدير (كلاهما خاصان بوضع المدير).
       اليومية مقفولة على القيمة المحددة في فلتر «اليومية» (في سطر 401 يدخلها وضع المدير
       من sessionStorage بنفس قيمة استعلام .eq('اليومية', ...)). */
    async function _repGenerateShipmentCode(daily) {
        /* نسخة حرفية من _generateHousingShipmentCode (housing-dashboard.html سطر 11892):
           نفس الصيغة PREFIX('COD') + ts36 + rand4 + '001'، و5 محاولات مع فحص محلي
           (allShipments) ثم فحص سيرفر، ومع fallback زمني فريد مضمون. */
        const PREFIX = 'COD';
        for (let attempt = 0; attempt < 5; attempt++) {
            const ts = Date.now().toString(36).toUpperCase();
            const rand = Math.random().toString(36).substring(2, 6).toUpperCase();
            const code = PREFIX + ts + rand + '001';
            let exists = false;
            for (const s of allShipments) {
                const sd = String(s['اليومية'] || '').trim();
                const sc = String(s['كود الشحنة'] || s.order_id || '').trim();
                if (sd && sd === daily && sc === code) { exists = true; break; }
            }
            if (!exists) {
                try {
                    const { data } = await supabaseClient
                        .from(CONFIG.TABLES.SHIPMENTS)
                        .select('id')
                        .eq('كود الشحنة', code)
                        .eq('اليومية', daily)
                        .limit(1);
                    if (!data || data.length === 0) return code;
                } catch (e) { /* نعتمد على فحص السيرفر عند الحفظ */ }
            }
        }
        /* فال باك زمني فريد مضمون */
        return PREFIX + Date.now().toString(36).toUpperCase() +
            Math.random().toString(36).substring(2, 8).toUpperCase() +
            String(Date.now() % 1000000);
    }

    function _repAddStatusSubModal(statusSel) {
        /* نسخة معزولة من نافذة السعر الفرعية (نظير _housingAddStatusSubModal):
           «تم» تملأ المدفوع من المبلغ عند الفراغ؛ و«تعديل سعر/شحن» تطلب السعر الجديد
           مع نفس التحقق «يرجى إدخال سعر صحيح»؛ والإلغاء يعيد الحالة السابقة. */
        const newStatus = statusSel.value;
        const prevStatus = statusSel.dataset.prev || '';
        if (newStatus === 'تم') {
            const amountEl = document.getElementById('addShipAmount');
            const paidEl = document.getElementById('addShipPaid');
            if (amountEl && paidEl && !paidEl.value.trim()) paidEl.value = amountEl.value;
            statusSel.dataset.prev = newStatus;
            return;
        }
        if (newStatus === 'تعديل سعر' || newStatus === 'شحن') {
            const paidEl = document.getElementById('addShipPaid');
            const currentPrice = paidEl ? paidEl.value.trim() : '';
            if (!currentPrice || currentPrice === '0') {
                Swal.fire({
                    title: newStatus === 'تعديل سعر' ? 'تعديل سعر' : 'شحن',
                    text: 'يرجى إدخال السعر الجديد',
                    input: 'text',
                    inputAttributes: { inputmode: 'numeric', dir: 'ltr' },
                    showCancelButton: true,
                    confirmButtonText: 'تأكيد',
                    cancelButtonText: 'الغاء',
                    inputValidator: (value) => {
                        if (!value || value.trim() === '0' || isNaN(parseFloat(value))) {
                            return 'يرجى إدخال سعر صحيح';
                        }
                    }
                }).then(result => {
                    if (result.isConfirmed && result.value) {
                        if (paidEl) paidEl.value = result.value;
                        statusSel.dataset.prev = newStatus;
                    } else {
                        for (let opt of statusSel.options) {
                            if (opt.value === prevStatus) { opt.selected = true; break; }
                        }
                    }
                });
                return;
            }
        }
        statusSel.dataset.prev = newStatus;
    }

    function doUpdateShipment(idx, payload) {
        const shipment = filteredShipments[idx];

        if (isArchivedShipment(shipment)) return Swal.fire('غير مسموح', 'لا يمكن تعديل شحنة مؤرشفة', 'warning');

        const _newStatus = payload['الحالة'];
        if (['تم', 'تم التسليم', 'تعديل سعر', 'شحن'].includes(_srcStatus) && _newStatus !== _srcStatus) {
            const merged = Object.assign({}, payload);
            merged['المدفوع'] = null;
            if (payload['سبب الحالة'] === undefined) merged['سبب الحالة'] = '';
            payload = merged;
        }
        supabaseClient
            .from(CONFIG.TABLES.SHIPMENTS)
            .update(payload)
            .eq('id', shipment.id)
            .then(({ error }) => {
                if (error) return Swal.fire('خطأ', error.message, 'error');
                Object.assign(shipment, payload);
                removeFavorite(String(shipment.id));
                applyFilters();
                if (Swal.isVisible()) Swal.close();
                Swal.fire({ icon: 'success', title: 'تم تحديث الحالة', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });
            });
    }

        return '+20' + digits;

                </a>
                <a href="${url}" target="_blank" rel="noopener" class="block p-4 rounded-xl border-2 text-center font-bold no-underline popup-opt-lavender" onclick="Swal.close()">
                    <i class="fab fa-whatsapp text-2xl mb-1"></i><br>واتساب أعمال
                </a>
            </div>`,
            showCancelButton: true,
            cancelButtonText: 'الغاء',
            showConfirmButton: false
        });
    }
    function showWhatsAppDialog(idx) {
        const s = filteredShipments[idx];
        if (!s) return;
        const msg = encodeURIComponent(
            `🧾 كود الشحنة: ${s['كود الشحنة'] || '-'}\n` +
            `👤 العميل: ${s['اسم العميل'] || '-'}\n` +
            `📞 الهاتف: ${s['الهاتف'] || ''}${s['هاتف بديل'] ? ' / ' + s['هاتف بديل'] : ''}\n` +
            `📍 العنوان: ${s['العنوان'] || '-'}\n` +
            `📦 الزون: ${s['الزون'] || '-'}\n` +
            `💰 المبلغ: ${s['المبلغ'] || '0'} ج\n` +
            `📋 الحالة: ${s['الحالة'] || '-'}\n` +
            `🏢 الراسل: ${s['الراسل'] || '-'}`
        );
        const phones = [s['الهاتف'] || '', s['هاتف بديل'] || ''].filter(Boolean);
        if (!phones.length) return;
        if (phones.length === 1) {
            const num = formatPhoneForWA(phones[0]);
            window.open(`https://api.whatsapp.com/send?phone=${num}&text=${msg}`, '_blank');
            return;
        }
        Swal.fire({
            title: 'اختر رقم لإرسال الواتساب',
            html: `<div class="grid grid-cols-1 gap-2">${phones.map((p, i) => {
                const num = formatPhoneForWA(p);
                return `<a href="https://api.whatsapp.com/send?phone=${num}&text=${msg}" target="_blank" rel="noopener" class="block p-4 rounded-xl border-2 text-center font-bold text-lg no-underline cursor-pointer ${i === 0 ? 'popup-opt-herb' : 'popup-opt-lavender'}" onclick="Swal.close()">
                    <i class="fab fa-whatsapp ml-2"></i>${p}
                </a>`;
            }).join('')}</div>`,
            showCancelButton: true,
            cancelButtonText: 'الغاء',
            showConfirmButton: false
        });
    }

    function showPostponeDialog(idx) {
        const shipment = filteredShipments[idx];
        if (!shipment) return;
        if (isArchivedShipment(shipment)) return Swal.fire('غير مسموح', 'لا يمكن تعديل شحنة مؤرشفة', 'warning');
        const opts = ['مؤجل غداً', 'مؤجل الأحد أو الاثنين', 'مؤجل الاربع أو الخميس أو الجمعه'];
        const postponeColors = ['popup-opt-sun', 'popup-opt-peach', 'popup-opt-gold'];
        Swal.fire({
            title: 'اختر سبب التأجيل',
            html: `<div class="grid grid-cols-1 gap-2">${opts.map((o, i) => `
                <div class="p-3 rounded-xl border-2 cursor-pointer text-center font-bold text-sm ${postponeColors[i]}" onclick="Swal.close();doUpdateShipment(${idx},{'الحالة':'مؤجل','سبب الحالة':'${o}'})">
                    ⏰ ${o}
                </div>`).join('')}</div>`,
            showCancelButton: true,
            cancelButtonText: 'الغاء',
            showConfirmButton: false
        });
    }

    function showRejectDialog(idx) {
        const shipment = filteredShipments[idx];
        if (!shipment) return;
        if (isArchivedShipment(shipment)) return Swal.fire('غير مسموح', 'لا يمكن تعديل شحنة مؤرشفة', 'warning');
        const opts = [
            'العميل طلب الالغاء','العميل مسافر',
            'المنطقه خارج نطاق التوصيل','العنوان غير صحيح',
            'المنتج غير مطابق','المنتج تالف',
            'تهرب بعد التنسيق','رقم الموبيل او الواتساب غير صحيح'
        ];
        const rejectColors = [
            'popup-opt-blush','popup-opt-peach','popup-opt-sun','popup-opt-air',
            'popup-opt-lavender','popup-opt-petal','popup-opt-mist','popup-opt-gold'
        ];
        Swal.fire({
            title: 'اختر سبب الرفض',
            html: `
                <div class="grid grid-cols-1 gap-1.5">
                    ${opts.map((o, i) => `
                        <div class="p-2.5 rounded-xl border-2 cursor-pointer text-center font-bold text-sm ${rejectColors[i]}" onclick="Swal.close();doUpdateShipment(${idx},{'الحالة':'الغاء','سبب الحالة':'${o}'})">
                            ❌ ${o}
                        </div>`).join('')}
                    <hr class="my-2 opacity-20">
                    <input type="text" id="customRejectReason" class="w-full p-2.5 rounded-xl border-2 text-sm text-center font-bold border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 outline-none focus:ring-2 focus:ring-indigo-400" placeholder="اكتب سبب آخر..." oninput="document.getElementById('customRejectBtn').style.display=this.value.trim()?'':'none'">
                    <div id="customRejectBtn" class="p-2.5 rounded-xl border-2 cursor-pointer text-center font-bold text-sm border-indigo-300 bg-indigo-50 text-indigo-700 dark:border-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-300" style="display:none" onclick="var v=document.getElementById('customRejectReason').value.trim();if(v){Swal.close();doUpdateShipment(${idx},{'الحالة':'الغاء','سبب الحالة':v})}">
                        ✏️ <span id="customRejectLabel">استخدام السبب المدخل</span>
                    </div>
                </div>
            `,
            showCancelButton: true,
            cancelButtonText: 'الغاء',
            showConfirmButton: false
        });
    }

    setInterval(async () => {
        const dailyHere = adminViewMode ? document.getElementById('filterDaily').value : '';
        if (adminViewMode && !dailyHere) return;
        let q = supabaseClient
            .from(CONFIG.TABLES.SHIPMENTS)
            .select('id,الحالة,اسم العميل,كود الشحنة');
        q = adminViewMode ? q.eq('اليومية', dailyHere) : q.eq('المندوب', repDisplayName);
        const { data } = await q;
        if (data) {
            const oldShipments = allShipments;
            allShipments = data;
            checkNotifications(false);
            allShipments = oldShipments;
        }
    }, 60000);

    // Init toggle button icon
    const toggleBtn = document.getElementById('toggleActionsBtn');
    if (toggleBtn) toggleBtn.innerHTML = '<i class="fas ' + (actionsHidden ? 'fa-eye' : 'fa-eye-slash') + '"></i>';

    initAdminRepChip();
    loadShipments();
</script>
</body>
</html>
